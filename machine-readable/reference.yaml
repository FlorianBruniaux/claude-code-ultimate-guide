  mcp_debug: "claude --mcp-debug"

# ════════════════════════════════════════════════════════════════
# AGENT TEMPLATE - see deep_dive.agent_template
# ════════════════════════════════════════════════════════════════
agent_template: |
  ---
  name: agent-name
  description: Use when [trigger]
  model: sonnet|opus|haiku
  tools: Read, Write, Edit, Bash
  ---
  # Instructions here

# Agent frontmatter — all official fields (verified 2026-02-26 against code.claude.com/docs/en/sub-agents)
agent_frontmatter_official_fields:
  name: "display name + /slash-command trigger"
  description: "trigger description (required for auto-discovery)"
  model: "sonnet (default) | opus | haiku | inherit"
  tools: "comma-separated list: Read, Write, Edit, Bash, Grep, Glob, Task(agent_type)..."
  disallowedTools: "tools to block (array)"
  permissionMode: "default | acceptEdits | dontAsk | bypassPermissions | plan"
  maxTurns: "integer — limit agent turns"
  skills: "skills to preload at startup (full content injected)"
  mcpServers: "MCP server configs"
  hooks: "lifecycle hooks (same format as settings.json hooks)"
  memory: "user | project | local — persistent memory scope"
  background: "true = always run as background task"
  isolation: "worktree = temporary git worktree isolation"
  color: "CLI output color"
agent_frontmatter_memory_scopes:
  user: "~/.claude/memory/<agent-name>.md — cross-project"
  project: ".claude/memory/<agent-name>.md — shared with team"
  local: ".claude/memory/<agent-name>.local.md — gitignored"
agent_frontmatter_guide_line: 6892  # Official fields table in ultimate-guide.md

# Skill frontmatter — all fields (agentskills.io spec + Claude Code extensions)
# Note: .claude/commands/ was merged into .claude/skills/ in CC 2.1.3 — use disable-model-invocation instead
skill_frontmatter_fields:
  # agentskills.io spec fields
  name: "lowercase, 1-64 chars, hyphens only, must match directory name"
  description: "when to use this skill (max 1024 chars) — also controls auto-activation trigger"
  allowed-tools: "space-delimited pre-approved tools; supports wildcard scoping: Bash(npm run *)"
  license: "license name or reference to bundled file"
  compatibility: "environment requirements (max 500 chars)"
  metadata: "arbitrary key-value pairs (author, version, etc.)"
  # Claude Code extension fields
  effort: "low|medium|high — overrides session effort level while this skill runs (v2.1.80+)"
  model: "haiku|sonnet|opus|full-model-id — overrides session model while this skill runs"
  argument-hint: "placeholder shown in slash menu when skill accepts $ARGUMENTS"
  disable-model-invocation: "true = user-invocable only (replaces .claude/commands/ pattern)"
  context: "fork = run skill in isolated subagent; fork ignored when called via Skill tool"
  hooks: "lifecycle hooks active during this skill's session (same format as settings.json hooks)"
skill_frontmatter_guide_line: 7857  # Frontmatter table in §5.2

# ════════════════════════════════════════════════════════════════
# HOOK EVENTS - see deep_dive.hooks
# ════════════════════════════════════════════════════════════════
hook_events:
  # Lifecycle
  SessionStart: "session opened"
  SessionEnd: "session closed"
  Setup: "only fires with --init-only, --init, or --maintenance in -p mode (not on normal startup)"
  # Agent actions
  Stop: "agent stopped naturally"
  StopFailure: "agent stopped with error"
  PreToolUse: "before tool call (exit 2 to block, return JSON to approve/modify)"
  PostToolUse: "after tool completes"
  PostToolUseFailure: "after tool fails"
  PostToolBatch: "after a full batch of parallel tool calls resolves, before next model call (can block)"
  # Permissions
  PermissionDenied: "permission refused"
  PermissionRequest: "permission being requested (can return decision)"
  # Compaction
  PreCompact: "before context compaction"
  PostCompact: "after context compaction"
  # Multi-agent
  SubagentStart: "subagent spawned"
  SubagentStop: "subagent completed"
  TeammateIdle: "teammate waiting"
  TaskCreated: "new task created"
  TaskCompleted: "task finished"
  # Configuration
  ConfigChange: "settings changed"
  InstructionsLoaded: "CLAUDE.md loaded"
  # File system
  CwdChanged: "working directory changed"
  FileChanged: "file modified on disk"
  WorktreeCreate: "git worktree created"
  WorktreeRemove: "git worktree removed"
  # User interaction
  UserPromptSubmit: "before prompt sent to model (can inject additionalContext)"
  UserPromptExpansion: "slash command expands into a prompt, before it reaches Claude (can block)"
  Notification: "UI notification triggered"
  MessageDisplay: "while assistant text is displayed on screen (display-only, cannot block; hookSpecificOutput.displayContent replaces rendered text)"
  Elicitation: "model requesting additional info"
  ElicitationResult: "user responded to elicitation"
  # Total: 30 events (updated 2026-06-03, source: official hooks reference)

# Hook Execution Model (v2.1.0+)
hooks_execution_model: 10324  # Section in ultimate-guide.md
hooks_session_scoped: 10489  # Session-scoped hooks (ephemeral, no settings.json, skills use this)
hooks_async_support: "v2.1.0+ - add 'async: true' for non-blocking execution; 'asyncRewake: true' for background with exit-2 wakeup"
hooks_async_use_cases: "logging, notifications, formatting, metrics (no feedback needed)"
hooks_sync_use_cases: "validation, type checking, security (feedback required)"
hooks_decision_matrix: 10369  # Decision matrix table
hooks_async_limitations: "no exit code feedback for blocking (exit 2 ignored), no real-time systemMessage, no guaranteed execution order. Note: additionalContext IS delivered on the next conversation turn after the background process exits."
hooks_async_bug_fix: "v2.1.23 - fixed cancellation in headless streaming"

