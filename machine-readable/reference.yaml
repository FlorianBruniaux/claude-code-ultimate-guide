# ════════════════════════════════════════════════════════════════
# PROMPTING FORMULA (see deep_dive.xml_prompting for details)
# ════════════════════════════════════════════════════════════════
prompt_formula:
  WHAT: "concrete deliverable"
  WHERE: "file paths"
  HOW: "constraints, approach"
  VERIFY: "success criteria"
  example: |
    Add input validation to login form.
    WHERE: src/components/LoginForm.tsx
    HOW: Use Zod, inline errors
    VERIFY: Empty email shows error

# ════════════════════════════════════════════════════════════════
# WORKFLOW (9 steps) - see deep_dive.first_workflow
# ════════════════════════════════════════════════════════════════
workflow:
  1: "claude"
  2: "/status"
  3: "Shift+Tab×2 for plan mode (if risky)"
  4: "describe task (WHAT/WHERE/HOW/VERIFY)"
  5: "review diff"
  6: "y/n"
  7: "run tests"
  8: "commit"
  9: "/compact when >70%"

# ════════════════════════════════════════════════════════════════
# CRITICAL COMMANDS - see deep_dive.essential_commands
# ════════════════════════════════════════════════════════════════
commands:
  _source_of_truth: "https://code.claude.com/docs/en/commands — official reference, always current. Full categorized mirror in guide/ultimate-guide.md#101-commands-table. Launch flags: https://code.claude.com/docs/en/cli-reference"
  _note: "~100 built-in commands exist; the subset below is the high-frequency one. Availability varies by platform, plan, and provider."

  # context
  /compact: "compress context - USE AT >70%; optional focus instructions"
  /clear: "reset conversation - USE AT >90%; aliases /reset /new; optional name labels the old convo in /resume"
  /context: "detailed token breakdown as a colored grid; 'all' expands per-item view in fullscreen"
  /btw: "side question in ephemeral read-only overlay, no tools, no history pollution"
  /memory: "edit CLAUDE.md files, toggle auto-memory, browse auto-memory entries"
  /add-dir: "add a working directory for file access this session (most .claude/ config NOT discovered from it)"
  /cd: "move the session to a new working directory, prompt cache preserved (v2.1.169+)"

  # session
  /status: "show context %, model, account, connectivity; works while Claude responds"
  /resume: "resume by ID or name, or open picker; alias /continue; background sessions marked bg"
  /branch: "branch the conversation and switch into the copy (v2.1.77+)"
  /fork: "copy the conversation into a NEW background session, keep working here (v2.1.212+ semantics)"
  /subtask: "forked subagent inheriting full conversation, runs in background, reports back here (v2.1.212+)"
  /background: "detach this session to run as a background agent; alias /bg"
  /stop: "stop the attached background session (transcript + worktree kept)"
  /rewind: "rewind conversation and/or code to a checkpoint; aliases /checkpoint /undo"
  /rename: "name the session, shown on prompt bar; no arg auto-generates"
  /recap: "one-line summary of the current session (v2.1.108)"
  /copy: "copy Nth-latest response; code-block picker; press w to write to file"
  /export: "export conversation as plain text to file or clipboard"
  /teleport: "bring a Claude Code on the web session into this terminal; alias /tp"
  /remote-control: "make this session drivable from claude.ai / mobile (Pro/Max); alias /rc"
  /desktop: "continue the session in the Desktop app (macOS + x64 Windows); alias /app"
  /exit: "exit the CLI; in an attached background session, detaches instead; alias /quit"

  # model, effort, modes
  /model: "switch: sonnet|opus|opusplan; left/right arrows adjust effort; 's' on a row = session only"
  /effort: "low|medium|high|xhigh|max|ultracode; max and ultracode are session-only; 'auto' resets to model default"
  /fast: "toggle fast mode (same model, faster output, higher price)"
  /plan: "read-only mode (safe exploration); exit by approving the plan or Shift+Tab"
  /ultraplan: "cloud plan mode: draft in cloud, review in browser, execute on web or teleport back (v2.1.91+, GitHub required)"
  /goal: "set completion condition; Claude works autonomously until met; live overlay shows elapsed time, turns, token usage (v2.1.139)"
  /advisor: "second model consulted for guidance at key moments; opus|sonnet|model-id|off (Fable 5 rejected)"
  /permissions: "manage allow/ask/deny rules, working dirs, recent auto-mode denials; alias /allowed-tools"
  /fewer-permission-prompts: "scan transcripts, propose read-only allowlist for .claude/settings.json (shipped as /less-permission-prompts in v2.1.111, renamed since)"
  /sandbox: "toggle sandbox mode (supported platforms only)"

  # parallel and scheduled work
  /tasks: "monitor background work incl. finished subagents; alias /bashes"
  /batch: "decompose a codebase-wide change into 5-30 units, one background subagent per unit in its own worktree, each opens a PR"
  /workflows: "workflow progress view: watch, pause, resume, save runs"
  /loop: "run a prompt repeatedly while the session stays open; no interval = self-paced; alias /proactive"
  /schedule: "create/update/list/run cloud routines; alias /routines"
  /deep-research: "fan out web searches, cross-check sources, cited report (manual-only since v2.1.218)"
  /autofix-pr: "cloud session watches the branch PR and pushes fixes on CI failure or review comments (needs gh CLI)"
  /remote-env: "choose the default environment for cloud agents"

  # review and ship
  /diff: "interactive viewer for uncommitted changes and per-turn diffs"
  /code-review: "review diff for correctness bugs + cleanups; levels low..max|ultra; --fix applies, --comment posts inline PR comments; background subagent since v2.1.218"
  /review: "fast single-pass read-only review of a GitHub PR (v2.1.202+ semantics)"
  /ultrareview: "deep multi-agent cloud review; now an alias of /code-review ultra (v2.1.114)"
  /security-review: "scan branch diff vs origin default branch for injection, auth, data-exposure risks (needs origin remote)"
  /simplify: "4 parallel agents review changed code for reuse, simplification, efficiency, altitude; NO correctness bugs since v2.1.154"
  /verify: "confirm a change works by building + running the app, not by trusting tests (v2.1.145+)"
  /run: "launch and drive the project's app to see a change working (v2.1.145+)"
  /run-skill-generator: "write a per-project skill teaching /run and /verify how to build and drive your app (v2.1.145+)"

  # config and extensions
  /config: "settings UI, or key=value to set directly (/config theme=dark); --help lists every key; alias /settings"
  /init: "generate starter CLAUDE.md (review before committing); CLAUDE_CODE_NEW_INIT=1 for interactive flow"
  /hooks: "view hook configurations for tool events"
  /mcp: "show MCP server status; reconnect <server> | enable | disable [<server>|all]"
  /plugin: "manage plugins: list, install, enable, disable"
  /reload-plugins: "reload active plugins without restarting; --force when prompt cache would be invalidated"
  /reload-skills: "re-scan skill and command dirs so on-disk changes apply mid-session (v2.1.152+)"
  /skills: "list skills, filter by typing, 't' sorts by token count, Space cycles visibility"
  /agents: "prints a reminder to ask Claude to manage subagents or edit .claude/agents/ (interactive manager removed in v2.1.198)"
  /keybindings: "open ~/.claude/keybindings.json"
  /statusline: "configure the status line, or auto-configure from your shell prompt"
  /terminal-setup: "configure terminal keybindings for Shift+Enter (VS Code, Cursor, Zed, Alacritty)"
  /setup-bedrock: "interactive Bedrock wizard; visible only with CLAUDE_CODE_USE_BEDROCK=1"
  /setup-vertex: "interactive Google Cloud Agent Platform wizard; visible only with CLAUDE_CODE_USE_VERTEX=1"
  /web-setup: "connect GitHub to Claude Code on the web using local gh credentials"
  /install-github-app: "install the Claude GitHub App, optionally wiring GitHub Actions workflows + secrets"
  /install-slack-app: "install the Claude Slack app via browser OAuth"
  /chrome: "configure Claude in Chrome settings"
  /design-login: "authorize design-system access for /design-sync with your claude.ai account"
  /design-sync: "upload the repo's React design system to Claude Design so generated designs use real components (Anthropic API only)"
  /claude-api: "load Claude API reference for your language; 'migrate' upgrades API code to a newer model; 'managed-agents-onboard' walkthrough"
  /dataviz: "chart and dashboard design guidance + runnable colorblind/contrast palette validator (v2.1.198+)"

  # interface and display
  /theme: "auto, light, dark, daltonized, ANSI, or custom themes from ~/.claude/themes/"
  /color: "prompt bar color for the session; no arg picks at random"
  /tui: "set terminal renderer (default|fullscreen) and relaunch with conversation intact (v2.1.110)"
  /focus: "toggle focus view: last prompt, one-line tool summary with diffstats, final response (fullscreen only, v2.1.110)"
  /scroll-speed: "tune mouse wheel scroll speed with interactive live-preview slider (fullscreen only, v2.1.139)"
  /voice: "toggle voice dictation, or set mode hold|tap|off (needs claude.ai account)"
  /ide: "manage IDE integrations and show status"

  # diagnostics and support
  /doctor: "full setup checkup: install health, PATH, settings parse, unused skills/MCP vs context cost, slow hooks, CLAUDE.md bloat, version drift; alias /checkup (v2.1.205+)"
  /debug: "enable debug logging for the session and troubleshoot from the debug log"
  /heapdump: "heap snapshot + memory breakdown to ~/Desktop; contains full conversation AND credentials, never share"
  /usage: "session cost, plan limits, activity stats; paid plans break down by skill/subagent/plugin/MCP (v2.1.118)"
  /cost: "alias for /usage (v2.1.118+)"
  /stats: "alias for /usage, opens on Stats tab (v2.1.118+)"
  /insights: "report on your sessions: project areas, interaction patterns, friction points"
  /release-notes: "interactive changelog picker; notes stay out of Claude's context since v2.1.208"
  /help: "show help and available commands"
  /bug: "report a bug or share the conversation, with consent screen; alias /share; local archive fallback on third-party providers (v2.1.212+)"
  /feedback: "send product feedback; same dialog and rules as /bug"
  /team-onboarding: "teammate ramp-up guide from 30 days of sessions, commands, MCP usage"
  /powerup: "interactive lessons with animated demos"

  # account and platform
  /login: "sign in to your Anthropic account"
  /logout: "sign out"
  /upgrade: "open the plan upgrade page (hidden on Enterprise)"
  /usage-credits: "configure usage credits or request them from your admin; previously /extra-usage"
  /privacy-settings: "view and update privacy settings (Pro and Max only)"
  /passes: "share a free week of Claude Code (eligible accounts only)"
  /mobile: "QR code for the Claude mobile app; aliases /ios /android"
  /stickers: "order Claude Code stickers"
  /radio: "open Claude FM lo-fi radio (not on Bedrock, Agent Platform, Foundry, Claude Platform on AWS)"

  # MCP-provided commands
  _mcp_prompts: "MCP servers expose prompts as /mcp__<server>__<prompt>, discovered from connected servers"

commands_removed_or_renamed:
  /execute: "NOT a Claude Code command. Absent from the official reference and from the entire CHANGELOG. Exit plan mode by approving the plan or pressing Shift+Tab"
  /less-permission-prompts: "renamed /fewer-permission-prompts (original name shipped in v2.1.111)"
  /extra-usage: "renamed /usage-credits"
  /pr-comments: "removed in v2.1.91; ask Claude to fetch PR comments instead"
  /vim: "removed in v2.1.92; use /config -> Editor mode"
  /output-style: "deprecated Oct 2025; use /config -> Preferred output style (Default/Explanatory/Learning)"

