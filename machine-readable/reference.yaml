  # Credentials, settings surface, and field-verified traps (Added 2026-07-29, verified on 2.1.220)
  sandbox_credentials_files: "guide/core/settings-reference.md#sandboxcredentialsfiles"  # deny reads of ~/.ssh, ~/.aws; sandbox default read covers the whole machine and has no built-in denylist
  sandbox_credentials_envvars: "guide/core/settings-reference.md#sandboxcredentialsenvvars"  # deny or mask; sandboxed commands inherit the parent environment unchanged
  sandbox_credentials_mask_requires_tls: "mask needs network.tlsTerminate or it fails closed; mask honored only from user/managed/--settings"
  sandbox_filesystem_disabled: "guide/core/settings-reference.md#sandboxfilesystemdisabled"  # v2.1.216; also disables credentials.files and the settings-file write protection
  sandbox_strict_allowlist: "guide/core/settings-reference.md#sandboxnetworkstrictallowlist"  # v2.1.219; enable last, turns a one-time prompt into a hard failure
  sandbox_allow_apple_events: "guide/core/settings-reference.md#sandboxallowappleevents"  # removes code-execution isolation; prefer excludedCommands
  sandbox_auto_allow_exceptions: "guide/security/sandbox-native.md#what-still-applies-in-auto-allow-mode"  # deny rules, rm on / or ~, content-scoped ask; bare Bash ask skipped when sandboxed
  sandbox_subagents_inherit: "guide/security/sandbox-native.md#subagents"  # same process, same config, cannot widen
  sandbox_excluded_commands_traps: "guide/security/sandbox-native.md#three-traps-all-verified-on-21220"
  sandbox_excluded_bare_name_noop: "a bare entry matches only the zero-argument string and never fires; use the glob form (github.com/anthropics/claude-code/issues/10524)"
  sandbox_excluded_whole_invocation: "a matching glob unsandboxes the ENTIRE Bash invocation including earlier commands; git status && cat ~/.ssh/id_ed25519 reads the key with 'git *' present (issues/81157, open 2026-07-25)"
  sandbox_excluded_prefix_breaks_match: "a wrapper, prefix or loop moves the command inside the string and the entry stops matching: 'gh api' works, 'rtk gh api' is sandboxed and fails, 'for d in ..; do git push; done' is sandboxed because the string starts with for. A PreToolUse hook that rewrites commands disables every exclusion naming a wrapped binary, silently"
  sandbox_excluded_three_traps: "guide/security/sandbox-native.md#three-traps-all-verified-on-21220"  # bare name never matches, glob unsandboxes the whole invocation, prefix breaks the match
  sandbox_go_cli_tls_symptom: "x509: OSStatus -26276 from gh/glab/gcloud/terraform means the CLI ran INSIDE the sandbox and could not reach the macOS keychain; it is an exclusion that did not match, not an auth or certificate problem"
  sandbox_config_example: "examples/config/sandbox-native.json"  # rewritten 2026-07-29, the previous version used six keys that do not exist
  sandbox_break_in_week: "guide/security/sandbox-native.md#plan-for-a-break-in-week"  # ~1 week before the config stabilizes; widen on evidence, never on anticipation
  sandbox_allow_local_binding: "guide/security/sandbox-native.md#local-servers-and-proxies-fail-to-bind"  # defaults to false, breaks every dev server and any tool proxying its own traffic; macOS only
  sandbox_global_npm_tooling: "guide/security/sandbox-native.md#global-npm-tooling-fails-with-eperm"  # globally installed CLIs cache inside their own install dir under ~/.nvm; allowing it grants write to a $PATH directory
  sandbox_read_the_last_error: "guide/security/sandbox-native.md#read-the-last-error-not-the-first"  # a denied credential read warns on every later command and survives the fix, collecting blame; denied write or bind is the fatal one
  sandbox_13_write_paths_real_config: "a config hardened over a week on a 200-repo setup ended at 13 write paths, each added from a specific failure: ~/.cargo ~/.rustup (crate fetch), ~/.claude (versioned dotfiles .git/index.lock), ~/.nvm (supply-chain firewall cache), allowLocalBinding (dev servers), ~/Library/Caches (Quarto/Typst/Playwright)"
  sandbox_ssh_needs_exception: "the proxy handles HTTP/HTTPS but not port 22 and blocks the ssh-agent socket, so git over SSH fails at DNS resolution; scope to git push */git fetch */git pull */ssh * rather than the whole binary"
  sandbox_no_curl_blocklist: "there is no built-in curl/wget blocklist; a missing domain hangs to timeout (HTTP 000, curl exit 28) rather than erroring cleanly"
  sandbox_settings_files_protected: "guide/security/sandbox-native.md#default-behavior"  # writes to settings.json denied at every scope, symlinks resolved since v2.1.210; use the Edit tool, which is not sandboxed
  sandbox_deny_read_misses_bash: "guide/security/sandbox-native.md#default-behavior"  # permissions.deny Read(...) governs the Read tool only; double dissociation on 2.1.220, ~/.npmrc (credentials.files, no deny rule) blocked 5/5 while .env (deny rule, no credentials entry) read exit 0 5/5
  sandbox_credentials_needs_absolute_paths: "guide/security/sandbox-native.md#default-behavior"  # sandbox.credentials.files resolves absolute paths, not **/ patterns, so .env files scattered across projects cannot be covered; a PreToolUse Bash hook is the only close
  sandbox_env_hook_scope: "guide/security/sandbox-native.md#default-behavior"  # scope the .env hook to printing/copying readers (cat head grep base64 cp) and let `source .env` through, otherwise you break how developers load their own variables
  sandbox_idea_vscode_write_denied: "guide/security/sandbox-native.md#default-behavior"  # .idea/ and .vscode/ deny writes inside allowWrite; .serena .cursor .zed .fleet .settings all accept them, so it is name-specific, and a package shipping .idea in its tarball kills pnpm install
  sandbox_tmpdir_witness: "guide/security/sandbox-native.md#check-whether-the-command-actually-ran-sandboxed"  # echo $TMPDIR tells sandboxed (/tmp/claude-NNN) from escaped (/var/folders/.../T/); the cheapest way to stop cross-session contradictions
  sandbox_excluded_flag_flips_whole_line: "guide/security/sandbox-native.md#check-whether-the-command-actually-ran-sandboxed"  # A/B verified: `git fetch origin` unsandboxes the entire invocation, `git -C <path> fetch origin` does not match and stays sandboxed; one flag decides
  sandbox_setuid_exec_denied: "guide/security/sandbox-native.md#commands-that-cannot-work-sandboxed-at-all"  # ps top su login carry mode 04000 and cannot exec; lsof and whoami do not and run fine; use lsof -nP -iTCP -sTCP:LISTEN instead of ps aux | grep
  sandbox_unix_socket_bind_denied: "guide/security/sandbox-native.md#commands-that-cannot-work-sandboxed-at-all"  # AF_UNIX bind+listen denied in every writable dir including $TMPDIR; allowLocalBinding covers TCP only, so tsx will not start; bundle with esbuild then run node
  sandbox_allowlist_filters_without_strict: "guide/security/sandbox-native.md#domain-filtering"  # allowedDomains filters even in permissive mode; adding a wildcard flipped cursor.com and www.jetbrains.com from unreachable to 200, hot, no restart
  sandbox_blocked_host_vs_missing_host: "guide/security/sandbox-native.md#domain-filtering"  # allowlist refusal hangs 5-7s; a nonexistent hostname fails in under 30ms even when a wildcard covers it
  sandbox_codeload_not_covered: "guide/security/sandbox-native.md#domain-filtering"  # github.com does not cover codeload.github.com, where npm and pnpm fetch git dependencies and tarballs
  sandbox_session_tmpdir: "guide/security/sandbox-native.md#default-behavior"  # $TMPDIR points at a per-session dir for sandboxed commands, /tmp itself is not writable
  sandbox_ubuntu_apparmor: "guide/security/sandbox-native.md#linuxwsl2-bubblewrap"  # Ubuntu 24.04+ blocks bubblewrap user namespaces; check sysctl kernel.apparmor_restrict_unprivileged_userns
  sandbox_runtime_oss: "https://github.com/anthropic-experimental/sandbox-runtime"
