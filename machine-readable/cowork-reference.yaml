# cowork-reference.yaml
# Quick lookup for Claude Cowork - ~2.5K tokens target
# Source: github.com/FlorianBruniaux/claude-cowork-guide (dedicated repo)
# Purpose: Condensed index for LLMs to quickly answer user questions about Cowork
#          from inside the Claude Code guide, without cloning the Cowork repo.
#
# NOTE: the `cowork/` directory was removed from this repo in v3.9.7 (commit 9a29ba4).
#       All documentation paths below are relative to repo.base_url, not to this repo.
#       Canonical source of truth: claude-cowork-guide/machine-readable/reference.yaml

