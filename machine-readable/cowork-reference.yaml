  releases_index: "https://github.com/FlorianBruniaux/claude-cowork-guide/blob/main/machine-readable/claude-cowork-releases.yaml"
  audience: "Knowledge workers using Claude Desktop (non-devs). For developers, this guide (Claude Code) is the right entry point."

