  - id: 08-021
    difficulty: senior
    profiles:
      - senior
      - power
    question: What is the key difference between the official `git-mcp` and `github-mcp` servers?
    options:
      a: Git MCP is for Linux; GitHub MCP is for macOS and Windows
      b: Git MCP uses OAuth; GitHub MCP uses API tokens
      c: Git MCP is official Anthropic (12 local git tools, no auth); GitHub MCP is official GitHub (remote platform, requires GitHub Copilot for remote mode)
      d: Git MCP works in CI/CD; GitHub MCP works only in interactive mode
    correct: c
    explanation: |-
      `git-mcp` is the **official Anthropic Git server** — provides 12 local git tools (log, status, diff, commit, etc.) with no authentication required. It operates entirely on the local repository. `github-mcp` is the **official GitHub server** — connects to the remote GitHub platform and requires authentication. For remote mode (push, PR creation, issues), it requires a GitHub Copilot subscription. Choose `git-mcp` for local git operations and `github-mcp` for GitHub platform integration.
      ---
    doc_reference:
      file: guide/diagrams/05-mcp-ecosystem.md
      section: Official Servers
      anchor: "#official-servers"
  - id: 08-022
    difficulty: intermediate
    profiles:
      - senior
      - power
    question: Which CLI subcommands let you authenticate or deauthenticate a named MCP server directly from the terminal, without going through the interactive /mcp menu?
    options:
      a: claude mcp auth <name>, which always opens a browser and has no headless option
      b: claude mcp connect <name> --headless, added in the same release as the /mcp menu
      c: claude mcp login <name> and claude mcp logout <name>, with a --no-browser flag that redirects the OAuth flow through stdin for SSH sessions
      d: claude mcp auth-refresh <name>, which silently renews tokens without user interaction
    correct: c
    explanation: claude mcp login <name> and claude mcp logout <name> authenticate and deauthenticate a specific MCP server straight from the CLI. Both shipped in v2.1.186. The --no-browser flag redirects the OAuth flow through stdin instead of opening a browser tab, which matters for SSH sessions or headless containers where no browser is reachable. The other three options name commands that don't exist in Claude Code.
    doc_reference:
      file: guide/core/claude-code-releases.md
      section: v2.1.186
  - id: 08-023
    difficulty: senior
    profiles:
      - senior
      - power
    question: What does the CLAUDE_CODE_MCP_TOOL_IDLE_TIMEOUT environment variable control?
    options:
      a: It sets how long Claude Code waits before retrying a failed MCP server connection at startup
      b: It controls how long a remote MCP tool call can hang with no response before it aborts with an error, overriding the 5-minute default
      c: It sets the interval between roots/list_changed notifications sent to MCP servers
      d: It controls how long tool schemas stay cached before Claude Code re-fetches them from the server
    correct: b
    explanation: Before v2.1.187, a remote MCP tool call that never responded could hang a session indefinitely. That release made such calls abort with an error after a default 5-minute idle period, and CLAUDE_CODE_MCP_TOOL_IDLE_TIMEOUT lets you override that default. It has nothing to do with connection retries at startup, roots notification intervals, or tool schema caching, which are separate mechanisms.
    doc_reference:
      file: guide/core/claude-code-releases.md
      section: v2.1.187
  - id: 08-024
    difficulty: power
    profiles:
      - senior
      - power
    question: As of v2.1.203, how does Claude Code's MCP roots/list capability behave when a session's working directories change mid-session?
    options:
      a: It is computed once at session start and never updates, even if directories are added later with --add-dir
      b: It only ever returns the single directory Claude Code was launched from, ignoring any additional working directories
      c: It requires the MCP server to poll roots/list on a timer, since Claude Code does not push change notifications
      d: It reflects the session's current additional working directories, and Claude Code sends notifications/roots/list_changed whenever they change, so servers can stay in sync dynamically
    correct: d
    explanation: v2.1.203 made the roots/list response reflect the session's current additional working directories, including ones added later via --add-dir or another mid-session mechanism, and Claude Code now sends a notifications/roots/list_changed event whenever that set changes. This lets an MCP server stay aligned with what the session considers in scope without polling. The other options describe a static or poll-based model that the actual push-notification design replaces.
    doc_reference:
      file: guide/core/claude-code-releases.md
      section: v2.1.203
  - id: 08-025
    difficulty: intermediate
    profiles:
      - senior
      - power
      - pm
    question: A documented MCP design principle warns against exposing one tool per individual API operation. What should a well-designed MCP tool encapsulate instead?
    options:
      a: One tool per API endpoint, so the agent has maximum flexibility to compose any sequence of calls itself
      b: As many tools as possible per server, so the model always has a specialized tool for any situation
      c: Tools that encapsulate a complete user intent, such as placing an order including the active discount, rather than exposing individual API operations the agent must chain itself
      d: Tools that return raw, unprocessed API responses, leaving all interpretation to the client model
    correct: c
    explanation: The guide's usage principles argue for designing MCP tools around complete user intents rather than individual API calls. A tool covering a single API operation forces the agent to chain several calls itself, and each call in that chain is an independent point of failure. A tool that wraps a full workflow, like placing an order with its discount already applied, keeps the model on one well-defined path instead of composing several fragile steps. Options a, b, and d describe the fragmented, over-specialized, or under-processed design the principle argues against.
    doc_reference:
      file: guide/ecosystem/mcp-servers-ecosystem.md
      section: Usage Principles (Beyond the Evaluation Checklist)
