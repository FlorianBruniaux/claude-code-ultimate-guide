  - id: 09-046
    difficulty: power
    profiles:
      - power
    question: What is the typical token cost multiplier for agent teams (3 agents)?
    options:
      a: Same as single agent (no overhead)
      b: 1.5x (minimal overhead)
      c: 3x+ (each agent runs separate model inference)
      d: 10x (exponential cost)
    correct: c
    explanation: |-
      **Token cost multiplier: 3x+** for 3 agents

      Why:
      - Each agent runs **separate model inference**
      - 3 agents = 3x input tokens, 3x output tokens
      - Context loading per agent (1M tokens × 3)
      - Coordination overhead (team lead synthesis)

      Cost justified when time saved > cost increase (production issues, critical analysis).
      Budget-constrained projects should use single agent.
    doc_reference:
      file: guide/workflows/agent-teams.md
      section: Cost Trade-offs
      anchor: "#cost-trade-offs"
  - id: 09-047
    difficulty: intermediate
    profiles:
      - senior
      - power
    question: You need to rename a function across 50 files. Which model and effort level is most appropriate?
    options:
      a: "Opus, effort: max — renaming at scale requires deep reasoning"
      b: "Sonnet, effort: high — large scope requires careful analysis"
      c: "Haiku, effort: low — mechanical find-replace, no design decisions"
      d: "Sonnet, effort: medium — safe default for any multi-file operation"
    correct: c
    explanation: |-
      **Haiku + low effort** is correct for mechanical tasks like renaming across files.

      The key question: does this task require reasoning, design decisions, or judgment?
      - Rename = find-replace. Pattern is known, approach is decided.
      - No edge cases requiring analysis.
      - Haiku is 60x cheaper than Opus on input tokens.

      Using Opus here wastes tokens on reasoning that doesn't add value.
      Save Opus for tasks where its depth changes the outcome.
    doc_reference:
      file: guide/ultimate-guide.md
      section: 2.5 Model Selection & Thinking Guide
      anchor: "#25-model-selection-thinking-guide"
  - id: 09-048
    difficulty: intermediate
    profiles:
      - senior
      - power
    question: "What does `model: haiku` in an agent's YAML frontmatter do?"
    options:
      a: Sets the agent's communication style to be more concise
      b: Forces the agent to use Haiku for all its sub-agent spawning
      c: Configures the agent to run on the Haiku model instead of the session default
      d: Enables cost-saving mode that reduces tool calls
    correct: c
    explanation: |-
      `model: haiku` in agent frontmatter sets the **model used for that specific agent**,
      overriding the session default.

      This is how you implement the planner/implementer pattern:
      ```yaml
      # planner.md
      model: opus    # Deep reasoning for strategy

      # implementer.md
      model: haiku   # Cost-effective for mechanical execution
      ```

      Each agent runs independently with its configured model.
      The session model (your default Sonnet) is unaffected.
    doc_reference:
      file: guide/ultimate-guide.md
      section: 2.5 Model per Agent Patterns
      anchor: "#model-per-agent-patterns"
  - id: 09-049
    difficulty: senior
    profiles:
      - senior
      - power
    question: What does the `effort` parameter actually control in Opus 4.6?
    options:
      a: Only the thinking token budget (how many tokens for extended reasoning)
      b: "The overall computational budget: thinking, tool calls, text verbosity, and analysis depth"
      c: The maximum number of tool calls per response
      d: A quality gate that filters low-confidence outputs
    correct: b
    explanation: |-
      `effort` controls the **overall computational budget** — not just thinking.

      At `effort: low`:
      - Fewer tool calls (combines operations when possible)
      - No explanatory preamble before actions
      - Concise responses

      At `effort: high`:
      - More tool calls with detailed explanations
      - Describes plan before executing
      - Comprehensive analysis and summaries

      This means `effort` affects behavior even when thinking is disabled (Alt+T off).
      It's a holistic efficiency dial, not a thinking toggle.
    doc_reference:
      file: guide/ultimate-guide.md
      section: 2.5 Effort Levels
      anchor: "#effort-levels"
  - id: 09-050
    difficulty: senior
    profiles:
      - senior
      - power
    question: "What is the observable impact of `effort: low` on tool usage?"
    options:
      a: Claude refuses to use any tools and responds from memory only
      b: Claude combines tool operations to minimize calls and skips explanatory preamble
      c: Claude limits itself to 3 tool calls maximum per response
      d: Claude uses only Read tools, no Write or Edit tools
    correct: b
    explanation: |-
      At `effort: low`, Claude optimizes for efficiency:

      **Tool usage**: Combines operations that would normally be separate calls.
      Instead of Read → Analyze → Read → Analyze, it might do a single targeted Read.

      **No preamble**: Skips "I'll now read the file to understand..." introductions.
      Actions happen directly, without narration.

      **Result**: Faster, cheaper execution for tasks that don't need transparency.
      Best for sub-agents in automated pipelines, classification tasks, lookups.

      Example task suited for `low`: `"Rename getUserById to findUserById across src/"`
    doc_reference:
      file: guide/ultimate-guide.md
      section: 2.5 Effort Levels
      anchor: "#effort-levels"
  - id: 09-051
    difficulty: senior
    profiles:
      - senior
      - power
    question: In the planner/implementer agent pattern, which model should each role use?
    options:
      a: "Planner: Sonnet, Implementer: Haiku"
      b: "Planner: Opus, Implementer: Sonnet"
      c: "Planner: Opus, Implementer: Haiku"
      d: "Both: Sonnet (consistency matters more than cost)"
    correct: c
    explanation: |-
      **Planner: Opus** — Strategy requires deep reasoning.
      Planning errors compound through all implementation steps.
      A wrong architecture decision caught at planning cost = minutes to fix.
      The same error found post-implementation = days.

      **Implementer: Haiku** — Mechanical execution.
      The approach is already decided by the planner.
      No design decisions = no need for deep reasoning.
      Haiku is 60x cheaper than Opus on input tokens.

      **When Haiku isn't enough**: If the implementation requires judgment calls,
      the implementer should stop and report rather than decide — or you use Sonnet instead.
    doc_reference:
      file: guide/ultimate-guide.md
      section: 2.5 Model per Agent Patterns
      anchor: "#model-per-agent-patterns"
  - id: 09-052
    difficulty: power
    profiles:
      - power
    question: What does MAX_ITERATIONS=8 control in agent team workflows, and what happens when the limit is reached?
    options:
      a: Maximum files an agent can read — agent stops reading and proceeds with available context
      b: Maximum retry attempts on any failing task — agent stops and reports to the team lead rather than continuing to retry
      c: Maximum number of teammate agents — team lead stops spawning and works sequentially
      d: Maximum token budget per agent — agent switches to low-effort mode to conserve tokens
    correct: b
    explanation: Loop Guardrails prevent agents from getting stuck in unproductive retry cycles. MAX_ITERATIONS sets a hard cap on retry attempts for any single failing task. When the limit is reached, the agent stops and reports to the team lead instead of retrying. A reflection prompt ("What specifically failed? What one change would fix it?") runs before each retry, forcing the agent to change approach rather than repeat the same failing action. Without iteration limits, agents can consume their entire token budget retrying a blocked task while the rest of the work queue stalls.
    doc_reference:
      file: guide/workflows/agent-teams.md
      section: Loop Guardrails
      anchor: "#loop-guardrails"
  - id: 09-053
    difficulty: power
    profiles:
      - power
    question: In the Dedicated Reviewer Teammate pattern, what is the recommended ratio and why must the reviewer be read-only?
    options:
      a: 1 reviewer per 10 builders — reviewer is a bottleneck at lower ratios; read-only prevents context overload
      b: 1 reviewer per 3-4 builders — fewer builders makes reviewer a bottleneck, more causes queue backup; read-only prevents merge conflicts
      c: 1 reviewer per builder — parity maximizes review coverage; read-only is optional
      d: 2 reviewers per builder — double review catches more bugs; read-only is required by the API
    correct: b
    explanation: "The Dedicated Reviewer Teammate adds a read-only agent that reviews on every TaskCompleted event. Ratio: 1 reviewer per 3-4 builders. Below this range the reviewer becomes a bottleneck. Above it, the review queue backs up and findings arrive too late to be acted on cleanly. Read-only is essential: a reviewer with write access will start fixing issues itself, creating merge conflicts and defeating the purpose of parallel isolation. The reviewer's job is to produce structured findings (blocking vs non-blocking), not to apply fixes."
    doc_reference:
      file: guide/workflows/agent-teams.md
      section: Dedicated Reviewer Teammate
      anchor: "#dedicated-reviewer-teammate"
  - id: 09-054
    difficulty: power
    profiles:
      - power
    question: What is the WHY/WHAT structure in the Iterative Retrieval pattern for sub-agents, and what is the maximum number of retrieval cycles?
    options:
      a: WHY = task description, WHAT = output format — maximum 5 cycles
      b: WHY = the problem being solved, WHAT = the specific task — maximum 3 cycles
      c: WHY = reason for spawning the agent, WHAT = files to read — maximum 2 cycles
      d: WHY = business rationale, WHAT = architecture decision — maximum 1 cycle
    correct: b
    explanation: "Iterative Retrieval gives sub-agents a bounded context budget. WHY = the problem being solved or constraint being met (gives the agent decision context). WHAT = the specific task to execute. An agent that only knows WHAT lacks the business constraints that prevent wrong choices. WHY steers implementation without additional correction cycles. Maximum 3 cycles: Cycle 1 uses initial context, Cycle 2 is a specific targeted request, Cycle 3 is a final targeted request where the agent must produce output regardless of remaining uncertainty."
    doc_reference:
      file: guide/workflows/agent-teams.md
      section: 9. Iterative Retrieval for Sub-Agents
      anchor: "#9-iterative-retrieval-for-sub-agents"
  - id: 09-055
    difficulty: power
    profiles:
      - power
    question: How does Claude Code structure its cache prefix hierarchy, and which layers are almost always cache hits?
    options:
      a: messages > system > tools — messages layer is always a hit, tools layer is always a miss
      b: system > tools > messages — only system prompt hits reliably
      c: tools > system > messages — tools and system layers are almost always hits, messages layer varies
      d: tools > messages > system — all three layers hit equally often
    correct: c
    explanation: "Every API call structures content in a fixed order: tools then system then messages. Cache matching always starts from the beginning of this prefix. Tools (the tool list) and system (CLAUDE.md) are stable across most turns. This means the first two layers are almost always cache hits, and only new message turns require fresh computation. Placing the most stable content first maximizes the proportion of each request served from cache at 0.1x base cost."
    doc_reference:
      file: guide/ultimate-guide.md
      section: Cost Optimization
      anchor: "#how-claude-code-handles-caching-automatically"
  - id: 09-056
    difficulty: power
    profiles:
      - power
    question: What is the 20-block lookback in prompt caching, what problem does it cause in long sessions, and what is the fix?
    options:
      a: Claude reads only the last 20 user messages — older context is lost permanently; the fix is /save
      b: Cache matching looks back approximately 20 message blocks — long sessions lose cache efficiency as early blocks fall outside the window; the fix is /compact
      c: Cache is invalidated after 20 tool calls — agents must pause every 20 calls; the fix is to reduce tool usage
      d: After 20 turns the session context is truncated — the fix is to start a new session
    correct: b
    explanation: "Cache matching uses a bounded lookback of approximately 20 blocks. In long sessions with many tool calls, blocks from early in the conversation fall outside this window and become cache misses even if their content hasn't changed. The practical consequence: very long sessions gradually lose cache efficiency at the message layer. The fix is /compact: it compresses conversation history into a single summary block, resetting the lookback window and restoring high cache hit rates for subsequent turns."
    doc_reference:
      file: guide/ultimate-guide.md
      section: Cost Optimization
      anchor: "#how-claude-code-handles-caching-automatically"
  - id: 09-057
    difficulty: power
    profiles:
      - power
    question: In the RPI workflow (Research > Plan > Implement), what artifact does each phase produce, and what happens at Gate 1?
    options:
      a: Research produces NOTES.md, Plan produces SPEC.md, Implement produces code — Gate 1 is a code review
      b: Research produces RESEARCH.md, Plan produces PLAN.md, Implement produces code — Gate 1 is a GO/NO-GO decision by the human before any planning begins
      c: Research produces a prompt, Plan produces a task list, Implement produces a diff — Gate 1 is an automated test pass
      d: All phases share a PROGRESS.md — gates are enforced by Claude automatically
    correct: b
    explanation: "RPI structures feature development into three locked phases. Phase 1 (Research): produces RESEARCH.md covering feasibility, risks, decision points, and an effort estimate. Gate 1: the human marks GO or NO-GO. Phase 2 (Plan): produces PLAN.md with architecture decisions and sequential implementation steps. Gate 2: human approves before any code is written. Phase 3 (Implement): produces working code with per-step test gates. Gate 1 is the most important: a NO-GO saves the cost of a full implementation that would need to be discarded."
    doc_reference:
      file: guide/workflows/rpi.md
      section: How the Gates Work
      anchor: "#how-the-gates-work"
  - id: 09-058
    difficulty: power
    profiles:
      - power
    question: What is the prompt caching minimum token threshold for Opus 4.6, and what is the practical implication for short CLAUDE.md files?
    options:
      a: "Opus 4.6: 1,024 tokens — any CLAUDE.md over one paragraph is cached"
      b: "Opus 4.6: 4,096 tokens — a CLAUDE.md under ~4,000 tokens is never cached on Opus 4.6"
      c: "Opus 4.6: 2,048 tokens — Opus and Sonnet share the same minimum"
      d: "Opus 4.6: 8,192 tokens — most CLAUDE.md files are too short to be cached"
    correct: b
    explanation: Minimum token thresholds for prompt caching eligibility vary by model. Opus 4.6, Opus 4.5, and Haiku 4.5 require 4,096 tokens minimum. Sonnet 4.6 requires 2,048 tokens. Sonnet 4.5 and earlier require 1,024 tokens. Blocks smaller than the threshold are never cached regardless of stability. A short CLAUDE.md that doesn't cross the threshold for the target model provides zero caching benefit, which is relevant for teams optimizing session costs on Opus 4.6.
    doc_reference:
      file: guide/ultimate-guide.md
      section: Cost Optimization
      anchor: "#how-claude-code-handles-caching-automatically"
