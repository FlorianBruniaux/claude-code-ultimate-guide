      anchor: "#what-is-a-permutation-framework"
  - id: 09-024
    difficulty: senior
    profiles:
      - senior
      - power
    question: What mental model describes the developer as an orchestrator of Claude instances?
    options:
      a: Pipeline Manager
      b: Agent Supervisor
      c: You Are the Main Thread - CPU scheduler analogy where developer dispatches tasks to agents
      d: Task Router
    correct: c
    explanation: "\"You Are the Main Thread\" uses the CPU scheduler analogy: the developer is the main thread dispatching work to Claude instances (worker threads). You manage priorities, context switches, and synchronization. Key insight: you don't write code - you manage the agents that write code. This shifts the skill from coding to orchestration."
    doc_reference:
      file: guide/ultimate-guide.md
      section: You Are the Main Thread
      anchor: "#you-are-the-main-thread"
  - id: 09-025
    difficulty: senior
    profiles:
      - senior
      - power
    question: When task list items consistently diverge from actual work done, what does the guide recommend?
    options:
      a: Delete the task list and start over
      b: Add more granular detail to each task
      c: "Use divergence patterns as diagnostic: too broad = break down, too narrow = step back, wrong priorities = re-align with goals"
      d: Ignore the divergence and continue
    correct: c
    explanation: |-
      Task list divergence is diagnostic, not failure. Patterns reveal issues:

      - **Too broad** tasks → break down into smaller pieces
      - **Too narrow** tasks → step back and think bigger
      - **Wrong priorities** → re-align tasks with actual goals
      - **Consistent drift** → your mental model of the problem is wrong

      Use divergence as signal, not noise.
    doc_reference:
      file: guide/ultimate-guide.md
      section: Task Lists as Diagnostic Tool
      anchor: "#task-lists-as-diagnostic-tool"
  - id: 09-026
    difficulty: senior
    profiles:
      - senior
      - power
    question: What is the 'occurrence rule' for claiming established patterns in code reviews?
    options:
      a: ">5 occurrences = established, 2-5 = emerging, <2 = not established"
      b: 10+ occurrences = established, 3-10 = emerging, <3 = not established
      c: Based on file count, not occurrences
      d: ">20 occurrences = established, 5-20 = emerging, <5 = not established"
    correct: b
    explanation: |-
      Anti-hallucination safeguards for code reviews define the occurrence rule:

      - **10+ occurrences** = established pattern (safe to reference)
      - **3-10 occurrences** = emerging pattern (mention cautiously)
      - **<3 occurrences** = NOT an established pattern (don't claim it is)

      This prevents Claude from hallucinating "established conventions" from a few examples.
    doc_reference:
      file: guide/ultimate-guide.md
      section: Split Role Sub-Agents
      anchor: "#split-role-sub-agents"
  - id: 09-027
    difficulty: power
    profiles:
      - power
    question: What are the 3 specialized agents in multi-agent code review?
    options:
      a: Security Reviewer, Performance Analyst, UX Reviewer
      b: Linter, Type Checker, Test Runner
      c: Consistency Agent, SOLID Agent, Defensive Code Auditor
      d: Junior Reviewer, Senior Reviewer, Architect Reviewer
    correct: c
    explanation: |-
      Multi-agent PR review uses 3 specialized agents:

      1. **Consistency Agent** - Checks naming conventions, import patterns, code style adherence
      2. **SOLID Agent** - Reviews architectural principles, dependency injection, single responsibility
      3. **Defensive Code Auditor** - Validates error handling, input validation, edge cases

      Each agent has anti-hallucination safeguards (occurrence rule, file-scoped claims).
    doc_reference:
      file: guide/ultimate-guide.md
      section: Split Role Sub-Agents
      anchor: "#split-role-sub-agents"
  - id: 09-028
    difficulty: senior
    profiles:
      - senior
      - power
    question: What is 'comprehension debt' according to Addy Osmani's '80% Problem'?
    options:
      a: Documentation debt - missing docs
      b: Code you shipped but don't fully understand - distinct from technical debt
      c: Review debt - unreviewed PRs
      d: Design debt - skipped design phase
    correct: b
    explanation: |-
      **Comprehension debt** (from Osmani's "80% Problem" article): Code you shipped but don't fully understand, distinct from technical debt (code you understand but know is suboptimal).

      Osmani synthesizes research showing that when AI generates 80%+ of code, developers risk accumulating comprehension debt by accepting suggestions without deep understanding.

      **The guide connects this to "Vibe Coding Trap"**: accepting code based on "feels right" intuition rather than verified understanding.

      **The fix**: Always be able to explain WHY the solution works, not just WHAT it does.
    doc_reference:
      file: guide/ecosystem/ai-ecosystem.md
      section: Addy Osmani (Google Chrome Team)
      anchor: "#addy-osmani-google-chrome-team"
  - id: 09-029
    difficulty: senior
    profiles:
      - senior
      - power
    question: What is the '4-step cycle' for CLAUDE.md as compounding memory?
    options:
      a: Write, Test, Deploy, Monitor
      b: Plan, Execute, Review, Commit
      c: Error, Rule, Read, Never repeated
      d: Ask, Implement, Validate, Ship
    correct: c
    explanation: |-
      The guide interprets Boris Cherny's concept of CLAUDE.md as "compounding memory" into a 4-step cycle:

      1. **Error** - Claude makes a mistake
      2. **Rule** - You add a rule to CLAUDE.md preventing it
      3. **Read** - Claude reads CLAUDE.md on every session start
      4. **Never repeated** - The mistake never happens again

      Boris Cherny states: "I treat Claude.md as compounding memory: every mistake becomes a durable rule for the team." The 4-step framework is the guide's interpretation of this principle, not an explicit quote from Boris.
    doc_reference:
      file: guide/ultimate-guide.md
      section: "Real-World Case: Boris Cherny (Interval)"
      anchor: "#real-world-case-boris-cherny-interval"
  - id: 09-030
    difficulty: senior
    profiles:
      - senior
      - power
    question: What is the "150-instruction ceiling" in context engineering?
    options:
      a: You cannot exceed 150K tokens in a single CLAUDE.md file
      b: The model stops responding after 150 consecutive instructions
      c: When instruction count exceeds roughly 150, attention becomes unreliable and adherence drops sharply
      d: Claude Code enforces a hard 150-rule limit and refuses to load more
    correct: c
    explanation: |-
      The 150-instruction ceiling refers to the approximate point at which transformer attention becomes unreliable for maintaining adherence to all instructions simultaneously. Research and community data (HumanLayer: 15-25% adherence on large instruction sets) show that once the number of always-on instructions exceeds roughly 150, Claude begins missing rules or applying them inconsistently. The fix is path-scoping — loading rules only when relevant files are in scope — to keep the effective instruction count well below the ceiling.
      ---
    doc_reference:
      file: guide/core/context-engineering.md
      section: The Context Budget
      anchor: "#2-the-context-budget"
  - id: 09-031
    difficulty: power
    profiles:
      - power
    question: What does the ACE pipeline stand for in context engineering?
    options:
      a: Assemble → Check → Execute — build context, validate with canary tests, then run Claude
      b: Audit → Compress → Evaluate — score context quality, remove bloat, then measure adherence
      c: Agent → Context → Exit — spawn agents, inject context, then terminate on completion
      d: Analyze → Configure → Embed — analyze codebase, configure rules, then embed in CLAUDE.md
    correct: a
    explanation: |-
      ACE = **Assemble → Check → Execute**. Assemble builds context from the team profile and project modules, producing a CLAUDE.md specific to the developer and task. Check runs canary validation — 3-5 test prompts that verify key behaviors before the actual task. If canary checks fail, fix the context issue before proceeding. Execute runs Claude with the validated context on the actual task. The pipeline is structured for teams running Claude Code in automated or semi-automated workflows where context quality must be verified before each run.
      ---
    doc_reference:
      file: guide/core/context-engineering.md
      section: The ACE Pipeline
      anchor: "#the-ace-pipeline"
  - id: 09-032
    difficulty: power
    profiles:
      - power
    question: What is the Plan-Validate-Execute pipeline and what makes it different from using `/plan` mode?
    options:
      a: A 3-command workflow where each command runs in a separate terminal window simultaneously
      b: A 3-command workflow (/plan-start, /plan-validate, /plan-execute) where planning, independent validation, and parallel execution are deliberately separated
      c: Three phases of the /plan command toggled by pressing Tab between each
      d: A git branching strategy with plan, staging, and production branches
    correct: b
    explanation: |-
      The Plan-Validate-Execute pipeline runs in 3 explicit commands: `/plan-start` (5-phase planning with a dynamic research agent team + ADRs), `/plan-validate` (independent 2-layer review by specialist agents — no confirmation bias), `/plan-execute` (parallel worktree agents through to merged PR). The key differentiator from native `/plan` mode: research is done by specialized agents in parallel (not one agent sequentially), validation is independent from planning, and every significant decision generates an ADR that auto-resolves future decisions. Run `/clear` between commands to reset context.
      ---
    doc_reference:
      file: guide/workflows/plan-pipeline.md
      section: TL;DR
      anchor: "#tldr"
  - id: 09-033
    difficulty: power
    profiles:
      - power
    question: What is the dual-instance planning pattern (Jon Williams) and how does it scale compared to other multi-instance approaches?
    options:
      a: Two Claude instances running on different machines for redundancy
      b: A planner instance and a reviewer instance that share the same working directory
      c: Horizontal scaling with 5-15 parallel implementer agents
      d: Vertical separation with one instance as Planner (read-only, creates specs) and another as Implementer (executes approved specs)
    correct: d
    explanation: |-
      The dual-instance pattern creates a **vertical separation**: Instance 1 ("Claude Zero" or Planner) is read-only and creates detailed specs stored in `.claude/plans/`. Instance 2 (Implementer) reads approved specs and executes them. Jon Williams' pattern costs ~$100-200/month vs the Boris multi-instance pattern ($500-1K/month, horizontal scaling with 5-15 parallel agents). The dual-instance pattern is best for spec-heavy, quality-focused work where the planning/implementation separation reduces rework and correction loops.
      ---
    doc_reference:
      file: guide/workflows/dual-instance-planning.md
      section: Comparison to Other Patterns
      anchor: "#comparison-to-other-patterns"
  - id: 09-034
    difficulty: senior
    profiles:
      - senior
      - power
    question: "What does `isolation: \"worktree\"` in an agent's YAML frontmatter do (v2.1.50+)?"
    options:
      a: Prevents the agent from reading files outside the current directory
      b: Automatically spawns the agent in a fresh git worktree every time it is invoked (v2.1.50+)
      c: Runs the agent in a Docker container with network isolation
      d: Creates a virtual sandbox that blocks all file write operations
    correct: b
    explanation: |-
      Setting `isolation: "worktree"` in an agent's frontmatter automatically spawns the agent in a fresh git worktree every time it is invoked. This replaces the earlier pattern of manually passing `isolation: "worktree"` to each individual Task tool call. The worktree is automatically created before the agent runs and cleaned up after it completes. This is the recommended approach for agents that perform large-scale refactors or generate changes that must not pollute the main working tree.
      ---
    doc_reference:
      file: guide/ultimate-guide.md
      section: Declarative isolation in agent definitions
      anchor: "#declarative-isolation-in-agent-definitions"
  - id: 09-035
    difficulty: power
    profiles:
      - power
    question: In the ACE pipeline, what happens when canary checks fail in the "Check" phase?
    options:
      a: If canary checks fail, the pipeline continues but logs warnings
      b: Canary checks run after execution to validate results
      c: If canary checks fail in the Check phase, the pipeline exits and you must fix the context issue before retrying
      d: Failed canary checks trigger an auto-repair loop that modifies CLAUDE.md
    correct: c
    explanation: |-
      When canary checks fail, the ACE pipeline **exits immediately** and prompts you to fix the context issue before retrying. The script design is explicit: if `CANARY_EXIT -ne 0`, print "Canary checks failed. Fix context issues before executing." and exit with code 1. This is intentional — running Claude with broken context causes downstream failures that are harder to debug. The canary set should be 3-5 test prompts that verify key behavioral requirements of your CLAUDE.md before each automated run.
      ---
    doc_reference:
      file: guide/core/context-engineering.md
      section: The ACE Pipeline
      anchor: "#the-ace-pipeline"
  - id: 09-036
    difficulty: senior
    profiles:
      - senior
      - power
    question: In the guide's multi-provider code review architecture, why does a RAG-based tool like Greptile catch things Claude Code Action's own PR review misses?
    options:
      a: Greptile indexes the whole repository ahead of time and can search across every file for an invariant, while Claude Code Action's review is scoped to the diff of a single PR
      b: Greptile runs a fine-tuned model that outperforms Claude at logic error detection within the same PR
      c: Greptile blocks merges directly, whereas Claude Code Action only posts advisory comments
      d: Claude Code Action cannot read multiple files during a review, so it only checks syntax within the changed lines
    correct: a
    explanation: "Greptile indexes the entire repository up front, so it can answer questions like whether a new query respects a scoping rule enforced across dozens of unrelated files. Claude Code Action reasons deeply about a diff with full codebase context, but it reviews one PR at a time and doesn't do repo-wide search. Option c reverses the actual role split: Claude Code Action is the tool allowed to block merge via the CI gate, not Greptile. Option d is wrong because Claude Code Action does reason about intent across full codebase context per PR, it just isn't scoped to search beyond that PR."
    doc_reference:
      file: guide/workflows/multi-provider-code-review.md
      section: Why Three Providers, Not One
      anchor: "#why-three-providers-not-one"
  - id: 09-037
