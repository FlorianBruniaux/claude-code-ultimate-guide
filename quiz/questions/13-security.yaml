  - id: 13-013
    difficulty: junior
    profiles:
      - junior
      - senior
      - power
    question: What is "Tool Poisoning via SKILL.md" (attack technique T001)?
    options:
      a: A SKILL.md file that is too large and slows down the agent
      b: A vulnerability in the SKILL.md parser that crashes the agent
      c: Hidden instructions in SKILL.md that make the agent execute malicious commands (curl|bash, base64 eval, password ZIPs)
      d: A SKILL.md that references deprecated API endpoints
    correct: c
    explanation: "Tool Poisoning via SKILL.md (T001) embeds hidden instructions that trick the agent into executing malicious commands. Common patterns include `curl | bash` from paste sites like glot.io, base64-decoded eval commands, and password-protected ZIPs (password: 'openclaw'). Used by ClawHavoc and ToxicSkills campaigns. Mitigation: scan SKILL.md for shell commands; never auto-execute prerequisites."
    doc_reference:
      file: guide/security/security-hardening.md
      section: Attack Patterns
      anchor: "#attack-patterns"
  - id: 13-014
    difficulty: intermediate
    profiles:
      - senior
      - power
    question: What is "Memory Poisoning" in the context of AI agent security (technique T002)?
    options:
      a: An attack that corrupts the agent's RAM causing crashes
      b: Injection of persistent malicious instructions into agent memory files (CLAUDE.md, SOUL.md, MEMORY.md)
      c: A denial-of-service attack that fills the agent's context window
      d: An attack that erases the agent's conversation history
    correct: b
    explanation: "Memory Poisoning (T002) injects persistent backdoor instructions into configuration files like SOUL.md, MEMORY.md, CLAUDE.md, or AGENTS.md. These instructions survive across sessions, creating cognitive worms that replicate across agent memory files. Identified in the ToxicSkills campaign. Mitigation: treat memory files as config; require code review for changes; monitor diffs."
    doc_reference:
      file: guide/core/memory-systems.md
      section: 7.1 Memory Poisoning via Prompt Injection
      anchor: "#71-memory-poisoning-via-prompt-injection"
  - id: 13-015
    difficulty: senior
    profiles:
      - senior
      - power
    question: How does a "Confused Deputy" attack work via MCP (technique T004)?
    options:
      a: The MCP server pretends to be a different server entirely
      b: The user accidentally connects to a wrong MCP server
      c: The MCP protocol itself has a buffer overflow vulnerability
      d: An attacker manipulates MCP session data or outputs, and the client trusts the poisoned response
    correct: d
    explanation: "A Confused Deputy attack via MCP (T004) occurs when an attacker manipulates MCP session IDs or outputs, causing the client to trust poisoned responses. Examples include session ID reuse in oatpp-mcp (CVE-2025-6515) and chaining Git MCP + Filesystem MCP via a poisoned README. Mitigation: cryptographic session IDs, input validation, least-privilege for MCP tools."
    doc_reference:
      file: guide/security/security-hardening.md
      section: Attack Patterns
      anchor: "#attack-patterns"
  - id: 13-016
    difficulty: intermediate
    profiles:
      - senior
      - power
    question: What is a DNS rebinding attack on local MCP servers (technique T005)?
    options:
      a: A malicious website rebinds its domain to 127.0.0.1 to access MCP servers running locally
      b: An attack that changes the DNS records of the MCP server's domain
      c: A technique to intercept MCP traffic between client and remote server
      d: An attack that poisons the DNS cache of the MCP server host
    correct: a
    explanation: "DNS rebinding on local MCP (T005) allows a malicious website to rebind its domain to 127.0.0.1, gaining access to MCP servers running locally without authentication. Affected: MCP Python SDK HTTP/SSE (CVE-2025-66416), MCP Gateway (CVE-2025-64443), Playwright MCP (CVE-2025-9611). Mitigation: use stdio transport; enable DNS rebinding protection; authenticate local servers."
    doc_reference:
      file: guide/security/security-hardening.md
      section: Attack Techniques
      anchor: "#attack-techniques"
  - id: 13-017
    difficulty: intermediate
    profiles:
      - senior
      - power
      - pm
    question: What makes hook-based exfiltration (technique T007) particularly dangerous?
    options:
      a: Hooks can modify the agent's system prompt
      b: Hooks run in a sandboxed environment with limited access
      c: Hooks in .claude/hooks/ run on agent events with full user privileges, enabling silent data exfiltration
      d: Hooks can only be installed by administrators
    correct: c
    explanation: "Hook-based exfiltration (T007) is dangerous because scripts in .claude/hooks/ execute on agent events (SessionStart, PostToolUse, etc.) with the full privileges of the user running Claude Code. A malicious hook can silently POST environment variables, file paths, or code content to external servers. Mitigation: review all hooks; forbid auto-running hooks from untrusted repos; maintain a hook allowlist."
    doc_reference:
      file: guide/security/security-hardening.md
      section: "Example: Exfiltration via Hook"
      anchor: "#example-exfiltration-via-hook"
  - id: 13-018
    difficulty: junior
    profiles:
