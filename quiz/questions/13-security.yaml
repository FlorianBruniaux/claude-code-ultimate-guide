      - power
      - pm
    question: What is the ClawHavoc campaign?
    options:
      a: A legitimate security testing framework for MCP servers
      b: A malware campaign of 341 malicious skills deploying Atomic Stealer (AMOS) to steal crypto wallets and browser data
      c: A vulnerability disclosure program run by Anthropic
      d: A collection of open-source security tools for agent hardening
    correct: b
    explanation: ClawHavoc (discovered by Koi Security, Feb 2026) is a campaign of 341 malicious skills on ClawHub/OpenClaw. 335 deploy Atomic Stealer (AMOS) malware targeting crypto wallets (60+ including Exodus, Binance, Electrum), browser data (Chrome, Safari, Firefox), SSH keys, and Telegram sessions. Categories include crypto tools (111), YouTube utilities (57), finance/social (76), Polymarket bots (34), and more.
    doc_reference:
      file: guide/security/security-hardening.md
      section: Campaigns
      anchor: "#campaigns"
  - id: 13-019
    difficulty: junior
    profiles:
      - junior
      - senior
      - power
      - pm
    question: According to Snyk's ToxicSkills report, what percentage of scanned AI agent skills had security flaws?
    options:
      a: 5.2% — a small fraction contained minor issues
      b: 12.7% — about one in eight had moderate flaws
      c: 36.82% — over a third of 3,984 skills had flaws, with 534 critical and 76 malicious payloads
      d: 78.5% — the vast majority were compromised
    correct: c
    explanation: "Snyk's ToxicSkills report (Feb 2026) scanned 3,984 skills across ClawHub and skills.sh. Results: 1,467 flawed (36.82%), 534 critical risk (13.4%), 76 confirmed malicious payloads, 10.9% with hardcoded secrets, 17.7% fetching remote content, 2.9% with remote prompt execution. 8 malicious skills were still live at time of scan."
    doc_reference:
