  - id: 13-020
    difficulty: intermediate
    profiles:
      - senior
      - power
    question: Which malicious author published 40+ skills in a programmatic malware campaign with clawhub typosquats?
    options:
      a: zaycv — programmatic malware campaign with clawhub/clawdhub1 typosquats
      b: moonshine-100rze — DAN-style jailbreaking skills
      c: pepe276 — Unicode-obfuscated instructions
      d: Aslaep123 — typosquatted exchange tools
    correct: a
    explanation: zaycv is the most prolific malicious author identified by Snyk ToxicSkills, publishing 40+ malicious skills in a programmatic campaign. The skills use clawhub and clawdhub1 typosquats to impersonate the legitimate ClawHub CLI. Other confirmed malicious authors include Aslaep123 (crypto/trading skills), pepe276 (Unicode-obfuscated DAN jailbreaking), and moonshine-100rze (mixed prompt-injection + exfiltration).
    doc_reference:
