      section: Malicious Authors
      anchor: "#malicious-authors"
  - id: 13-021
    difficulty: senior
    profiles:
      - senior
      - power
    question: How does the ClawHavoc campaign deliver its AMOS malware payload?
    options:
      a: Through compromised npm packages with postinstall scripts
      b: By exploiting CVEs in the MCP protocol directly
      c: Via phishing emails with malicious attachments
      d: "Fake prerequisites in SKILL.md, base64-encoded shell snippets from glot.io, and password-protected ZIPs (password: 'openclaw')"
    correct: d
    explanation: "ClawHavoc uses a multi-stage delivery: (1) SKILL.md contains fake prerequisites that trick the agent into running commands, (2) base64-encoded shell snippets fetched from glot.io paste service, (3) password-protected ZIP files with the password 'openclaw', and (4) second-stage droppers from raw IPs (91.92.242.30, etc.). This chain exploits the agent's trust in SKILL.md instructions."
    doc_reference:
      file: guide/security/security-hardening.md
      section: Campaigns
      anchor: "#campaigns"
  - id: 13-022
    difficulty: senior
    profiles:
      - senior
      - power
    question: What is CVE-2025-49596 (MCP Inspector vulnerability)?
    options:
      a: A low-severity information disclosure in the MCP Inspector UI
      b: A critical RCE (CVSS 9.4) via unauthenticated proxy on 0.0.0.0, with ~560 exposed instances found
      c: A medium-severity denial-of-service in the MCP Inspector CLI
      d: A cross-site scripting flaw in the MCP Inspector web interface
    correct: b
    explanation: "CVE-2025-49596 is a critical vulnerability (CVSS 9.4) in the MCP Inspector. It exposes an unauthenticated proxy on 0.0.0.0, enabling drive-by RCE from any malicious web page. Approximately 560 exposed instances were found on Shodan. Fixed in MCP Inspector >= 0.14.1. Mitigation: update immediately and restrict to localhost binding."
    doc_reference:
      file: guide/security/security-hardening.md
      section: CVE Summary (2025-2026)
      anchor: "#cve-summary-2025-2026"
  - id: 13-023
    difficulty: power
    profiles:
      - power
    question: What does CVE-2025-66032 expose in Claude Code?
    options:
      a: A memory leak in Claude Code's language model integration
      b: An authentication bypass in Claude Code's API key handling
      c: 8 command execution bypasses via blocklist flaws (man --html, sed e modifier, git arg ambiguity, bash variable expansion)
      d: A denial-of-service via excessive file watching
    correct: c
    explanation: "CVE-2025-66032 (discovered by Flatt Security) reveals 8 different ways to bypass Claude Code's command blocklist and execute arbitrary commands. Techniques include: man --html (opens browser with arbitrary URL), sed e modifier (executes commands), git argument ambiguity, and bash variable expansion. Fixed in Claude Code >= 1.0.93. This demonstrates why defense-in-depth matters beyond simple blocklists."
    doc_reference:
      file: guide/security/security-hardening.md
      section: CVE Summary (2025-2026)
      anchor: "#cve-summary-2025-2026"
  - id: 13-024
    difficulty: junior
    profiles:
      - junior
      - senior
      - power
      - pm
    question: What is the minimum safe version of Claude Code that fixes the sandbox bypass vulnerability?
    options:
      a: ">= 2.1.34 (fixes ADVISORY-CC-2026-001 sandbox bypass)"
      b: ">= 1.0.93 (fixes command blocklist bypasses only)"
      c: ">= 1.0.111 (fixes WebFetch SSRF only)"
      d: ">= 0.14.1 (fixes MCP Inspector RCE only)"
    correct: a
    explanation: Claude Code >= 2.1.34 is the minimum safe version, fixing ADVISORY-CC-2026-001 — a sandbox bypass where commands excluded from sandboxing could bypass Bash permission enforcement. Earlier versions also have CVE-2025-66032 (8 blocklist bypasses, fixed 1.0.93) and CVE-2026-24052 (WebFetch SSRF, fixed 1.0.111). Always run the latest version for cumulative security fixes.
    doc_reference:
      file: guide/security/security-hardening.md
      section: CVE Summary (2025-2026)
      anchor: "#cve-summary-2025-2026"
  - id: 13-025
    difficulty: junior
    profiles:
      - junior
      - senior
      - power
      - pm
    question: Which CLI tool scans MCP server configurations for known vulnerabilities?
    options:
      a: mcp-fortress — a runtime protection dashboard
      b: mcp-scan (npx mcp-scan) — backed by Snyk with 90-100% recall on known malicious skills
      c: skills-ref validate — a skill spec compliance checker
      d: Garak — an LLM vulnerability scanner by NVIDIA
    correct: b
    explanation: "mcp-scan (run via `npx mcp-scan`) is the primary CLI tool for scanning MCP configurations. Backed by Invariant/Snyk, it detects known vulnerable MCP servers, scans SKILL.md for prompt injection and malicious code, and supports Claude Desktop, Cursor, and Windsurf configs. It achieves 90-100% recall with 0% false positives on skills.sh top-100. Limitation: cannot detect runtime-only payloads."
    doc_reference:
      file: guide/security/security-hardening.md
      section: 1.2 Agent Skills Supply Chain Risks
      anchor: "#12-agent-skills-supply-chain-risks"
  - id: 13-026
    difficulty: intermediate
    profiles:
      - senior
      - power
    question: What does SafeDep vet MCP provide for agent security?
    options:
      a: Runtime monitoring of MCP server memory usage
      b: Automated patching of vulnerable MCP servers
      c: DNS rebinding protection for local MCP servers
      d: Software composition analysis that screens packages before install and detects slopsquatting
    correct: d
    explanation: SafeDep vet MCP is a software composition analysis tool integrated as an MCP server. It screens package suggestions before pip/npm install, detects slopsquatting (AI-hallucinated package names that attackers register), and identifies vulnerable and malicious packages. It's package-focused and complements mcp-scan (which focuses on MCP configs and SKILL.md scanning).
    doc_reference:
      file: guide/security/security-hardening.md
      section: Scanning Tools
      anchor: "#scanning-tools"
  - id: 13-027
    difficulty: intermediate
    profiles:
      - senior
      - power
      - pm
    question: Which directory in the .claude/ folder is considered most security-sensitive?
    options:
      a: .claude/hooks/ — scripts run with full user privileges on every agent event
      b: .claude/agents/ — agent definitions can override system prompts
      c: .claude/commands/ — custom commands can execute arbitrary code
      d: .claude/settings.json — contains all API keys and tokens
    correct: a
    explanation: "The .claude/hooks/ directory is the most security-sensitive because hook scripts execute automatically on agent events (SessionStart, PostToolUse, etc.) with the full privileges of the user running Claude Code. Unlike agents or commands which require explicit invocation, hooks fire automatically. Red flag patterns in hooks include: curl/wget (network calls), base64 (payload obfuscation), /dev/tcp (reverse shells), and eval/exec (dynamic code execution)."
    doc_reference:
      file: guide/security/security-hardening.md
      section: 5-Minute .claude/ Audit Checklist
      anchor: "#5-minute-claude-audit-checklist"
  - id: 13-028
    difficulty: senior
    profiles:
      - senior
      - power
    question: Which combination of patterns in a .claude/hooks/ script indicates a likely malicious hook?
    options:
      a: echo, printf, and tee commands for logging
      b: git, npm, and docker commands for CI/CD integration
      c: curl/wget + base64 + /dev/tcp + eval — network calls, encoding, reverse shell, and dynamic execution
      d: date, hostname, and whoami for audit logging
    correct: c
    explanation: "Malicious hooks typically combine: curl/wget (data exfiltration), base64 (payload obfuscation used by ClawHavoc via glot.io), /dev/tcp or /dev/udp (bash reverse shells — no legitimate hook use case), and eval/exec (dynamic code execution). Additional red flags: access to .env/credentials/ssh keys, references to paste sites (glot.io, pastebin.com), and nc/ncat/netcat (netcat reverse shells — remove immediately)."
    doc_reference:
      file: guide/security/security-hardening.md
      section: 5-Minute .claude/ Audit Checklist
      anchor: "#5-minute-claude-audit-checklist"
  - id: 13-029
    difficulty: intermediate
    profiles:
      - senior
      - power
      - pm
    question: How many unauthenticated MCP servers were discovered exposed on the internet by Bitsight TRACE?
    options:
      a: About 50 servers, mostly development instances
      b: Approximately 1,000 servers with no authentication, exposing Kubernetes clusters, CRM access, and arbitrary shell
      c: Over 10,000 servers, all running outdated MCP versions
      d: Fewer than 10, all quickly patched after disclosure
    correct: b
    explanation: Bitsight TRACE's continuous scanning found approximately 1,000 unauthenticated MCP servers exposed on the internet. These exposed servers provided access to Kubernetes clusters, CRM systems, WhatsApp messaging, and arbitrary shell execution — all without any authentication. This highlights the critical importance of never exposing MCP servers to the internet without proper authentication.
    doc_reference:
      file: guide/security/security-hardening.md
      section: Defensive Resources
      anchor: "#defensive-resources"
  - id: 13-030
    difficulty: power
    profiles:
      - power
    question: What is the SAFE-MCP framework?
    options:
      a: An Anthropic-maintained list of approved MCP servers
      b: A runtime sandbox for isolating MCP server processes
      c: A certification program for MCP server developers
      d: A security framework with 80+ techniques mapped to ATT&CK for MCP environments, providing policy-based blocklists
    correct: d
    explanation: SAFE-MCP (safemcp.org) is a comprehensive security framework that maps 80+ attack techniques to the MITRE ATT&CK framework, specifically adapted for MCP environments. It provides policy-based blocklists and defensive recommendations. Combined with tools like mcp-scan, Docker MCP Gateway, and Snyk AI-BOM, it forms part of a defense-in-depth strategy for securing AI agent infrastructure.
    doc_reference:
      file: guide/security/security-hardening.md
      section: Defensive Resources
      anchor: "#defensive-resources"
  - id: 13-031
    difficulty: senior
    profiles:
      - senior
      - power
    question: What are the 4 pre-configured guardrail tiers in the enterprise governance guide?
    options:
      a: Bronze, Silver, Gold, Platinum — scaling by team size only
      b: Starter, Standard, Strict, Regulated — scaling by compliance requirements and production exposure
      c: Basic, Advanced, Enterprise, Government — scaling by plan tier
      d: Dev, Staging, Production, Compliance — mirroring deployment environments
    correct: b
    explanation: |-
      The 4 tiers are: **Starter** (small team <5, internal projects, 10-minute setup), **Standard** (team 5-20, production-adjacent code, adds MCP controls and workflow gates), **Strict** (production systems with real customer data, full approval workflow + audit log), and **Regulated** (HIPAA/SOC2/PCI/finance environments, all previous tiers + compliance audit trail). Each tier provides a ready-to-copy `settings.json` and CLAUDE.md additions. The tiers scale by compliance requirements and production exposure, not by headcount alone.
      ---
    doc_reference:
      file: guide/security/enterprise-governance.md
      section: Guardrail Tiers
      anchor: "#4-guardrail-tiers"
  - id: 13-032
    difficulty: power
    profiles:
      - power
    question: What does the MCP governance workflow in the enterprise governance guide provide?
    options:
      a: A CI/CD pipeline that auto-approves MCP servers with green security scans
      b: The process for MCP server developers to submit their tools to the Anthropic marketplace
      c: A Docker-based isolation system for running untrusted MCP servers
      d: An approval pipeline (request → review → approve → deploy) with a YAML registry tracking approved/pending/denied servers
    correct: d
    explanation: |-
      The MCP governance workflow provides an **approval pipeline** for org-level MCP server control: request → review → approve → deploy. It includes a YAML registry format for tracking approved, pending, and denied servers with risk classification (LOW/MEDIUM/HIGH), data scope classification (PUBLIC/INTERNAL/CONFIDENTIAL/RESTRICTED), and expiry dates. A governance enforcement hook (`governance-enforcement-hook.sh`) validates active MCP configuration against the approved registry at session start — warning without blocking (governance-first, not friction-first). This is for teams that need auditability for SOC2/ISO27001 compliance.
      ---
    doc_reference:
      file: guide/security/enterprise-governance.md
      section: MCP Governance Workflow
      anchor: "#3-mcp-governance-workflow"
  - id: 13-033
    difficulty: senior
    profiles:
      - senior
      - power
    question: How does native sandboxing differ between macOS and Linux in Claude Code?
    options:
      a: macOS uses Docker containers; Linux uses native process sandboxing
      b: macOS uses bubblewrap; Linux uses Seatbelt (sandbox-exec)
      c: macOS uses Seatbelt (sandbox-exec, built-in); Linux uses bubblewrap + socat (must install separately)
      d: Both platforms use the same Docker-based sandbox, with optional native mode
    correct: c
    explanation: |-
      On **macOS**, native sandboxing uses **Seatbelt** (the built-in `sandbox-exec` system) — no installation required, works out of the box from v2.1.0+. On **Linux/WSL2**, it uses **bubblewrap** + **socat**, which must be installed manually (`sudo apt-get install bubblewrap socat` on Ubuntu/Debian). Native sandboxing is not yet available on WSL1 or Windows (planned). The `dangerouslyDisableSandbox` parameter allows incompatible tools (like `docker` or `watchman`) to escape the sandbox on a per-command basis with user approval.
      ---
    doc_reference:
      file: guide/security/sandbox-native.md
      section: TL;DR
      anchor: "#tldr"
  - id: 13-034
    difficulty: senior
    profiles:
      - senior
      - power
    question: What is the `dangerouslyDisableSandbox` parameter and when does it apply?
    options:
      a: A settings.json flag that permanently disables all sandboxing for the project
      b: A per-command escape hatch that lets Claude retry a failed command outside the sandbox, with user approval
      c: A CLI flag equivalent to --dangerously-skip-permissions
      d: A managed policy setting that only admins can configure
    correct: b
    explanation: |-
      `dangerouslyDisableSandbox` is a **per-command escape hatch** for tools incompatible with sandboxing (e.g., `docker`, `watchman`). When a command fails due to sandbox restrictions, Claude analyzes the failure and retries with this parameter set. The user receives a normal permission prompt, and if approved, the command runs outside the sandbox. To disable this escape hatch entirely for maximum security, set `"sandbox.allowUnsandboxedCommands": false` in `settings.json` — this forces all commands to run sandboxed or be explicitly listed in `excludedCommands`.
      ---
    doc_reference:
      file: guide/security/sandbox-native.md
      section: Escape Hatch
      anchor: "#6-escape-hatch"
  - id: 13-035
    difficulty: senior
    profiles:
      - senior
      - power
    question: What does the sandbox.credentials setting do when enabled in Claude Code, introduced in v2.1.187?
    options:
      a: It encrypts all environment variables before they reach the sandbox
      b: It requires a password prompt before any sandboxed command runs
      c: It restricts sandboxed commands to a single allowed AWS region
      d: It blocks sandboxed commands from reading credential files like .aws/credentials and .ssh/, plus secret environment variables
    correct: d
    explanation: "sandbox.credentials, added in v2.1.187, blocks sandboxed commands from reading credential files such as .aws/credentials and .ssh/, along with secret environment variables. This closes a gap where a sandboxed process could otherwise still read and exfiltrate stored secrets even while filesystem and network access were restricted. The other options describe capabilities the setting doesn't have: it doesn't encrypt variables, add an interactive password gate, or restrict AWS regions."
    doc_reference:
      file: guide/core/claude-code-releases.md
      section: v2.1.187
  - id: 13-036
    difficulty: power
    profiles:
      - power
    question: Since autoMode.classifyAllShell was introduced in v2.1.193, where can a user now see why Auto mode denied a shell command?
    options:
      a: In a separate log file written only when CLAUDE_CODE_DEBUG is set
      b: Nowhere; denial reasons are intentionally hidden from the user for security
      c: Only in a dedicated security dashboard reachable from claude.ai
      d: In the transcript, the denial toast notification, and the /permissions recent denials view
    correct: d
    explanation: "v2.1.193 added autoMode.classifyAllShell, which routes every Bash and PowerShell command through the auto-mode risk classifier instead of only commands matching arbitrary-code-execution patterns. The same release surfaced denial reasons in three places: the transcript, the denial toast, and the /permissions recent-denials list, making a blocked command easier to diagnose without digging through logs. There is no separate dashboard or hidden debug-only log for this, and hiding the reason entirely would defeat the point of the change."
    doc_reference:
      file: guide/core/claude-code-releases.md
      section: v2.1.193
  - id: 13-037
    difficulty: senior
    profiles:
      - senior
      - power
    question: What security gap did v2.1.196 close regarding claude mcp list and claude mcp get?
    options:
      a: These commands stopped requiring authentication, exposing MCP server names publicly
      b: They no longer spawn .mcp.json servers self-approved by a committed .claude/settings.json; unapproved servers now show as Pending approval
      c: They started deleting unused MCP server configurations automatically
      d: They began caching MCP server responses without invalidation, causing stale data
    correct: b
    explanation: Before v2.1.196, a repository could ship a committed .claude/settings.json that self-approved an .mcp.json server. Running claude mcp list or claude mcp get would then silently spawn that server even if it had never actually been reviewed by the developer, and even if it was malicious. The fix makes those commands show unapproved servers as "Pending approval" instead of running them, closing a path where a malicious committed settings file could grant a server auto-approval before anyone looked at it.
    doc_reference:
      file: guide/core/claude-code-releases.md
      section: v2.1.196
  - id: 13-038
    difficulty: power
    profiles:
      - power
    question: Why does the guide describe WebAssembly-based sandboxing, via tools like Wassette, as a meaningful alternative to process-level isolation for MCP tools?
    options:
      a: It compiles MCP servers into .wasm components with runtime-enforced capability grants, so a tool only gets the filesystem paths, network hosts, and env vars explicitly declared, rather than relying on the tool's own code to self-restrict
      b: It makes MCP tool calls run faster than native binaries by skipping the permission system entirely
      c: It automatically patches known CVEs in MCP servers at runtime without requiring updates
      d: It replaces the need for reviewing MCP server source code before installation
    correct: a
    explanation: "WASM-based sandboxing addresses a specific threat: a compromised or careless MCP server with unpredictable filesystem or network access. Wassette compiles an MCP server to a Wasm component and enforces a YAML-declared capability grant at the runtime level, so the deny-by-default boundary doesn't depend on the tool's own code behaving correctly. The guide calls this browser-grade isolation, a meaningful guarantee but not a certified enterprise security boundary, and notes Wassette itself isn't yet production-ready. It doesn't speed up calls by skipping permissions, patch CVEs automatically, or remove the need for a code review."
    doc_reference:
      file: guide/security/sandbox-isolation.md
      section: 7b. WebAssembly-based MCP Tool Sandboxing (Experimental)
      anchor: "#7b-webassembly-based-mcp-tool-sandboxing-experimental"
  - id: 13-039
    difficulty: senior
    profiles:
      - senior
      - power
    question: CVE-2026-50548 and CVE-2026-50549, both rated critical in the guide's CVE table, are kept there for cross-tool awareness. What do they describe?
    options:
      a: A Claude Code sandbox escape triggered by piped sed and echo commands
      b: A Cursor agent terminal sandbox escape combining a working-directory restriction bypass with a file-write escape when path canonicalization fails, letting an agent run commands and write files outside the workspace boundary
      c: A GitHub Actions supply chain attack against Claude Code plugin marketplaces
      d: A prompt injection vulnerability in the WebFetch tool allowing SSRF
    correct: b
    explanation: CVE-2026-50548 and CVE-2026-50549 affect Cursor, not Claude Code. They combine a working-directory restriction bypass with a file-write escape that triggers when path canonicalization fails, letting an agent execute commands and write files outside the intended workspace. The guide keeps them in its table because the same class of sandbox-escape bug can affect any coding agent that enforces workspace boundaries through path checks, not just Claude Code. Option a describes a different, Claude Code-specific issue tracked elsewhere in the table, and options c and d describe attack types not documented under these CVE numbers.
    doc_reference:
      file: guide/security/security-hardening.md
      section: CVE Summary (2025-2026)
      anchor: "#cve-summary-2025-2026"
