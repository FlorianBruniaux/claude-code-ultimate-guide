  - id: 10-022
    difficulty: junior
    profiles:
      - junior
      - senior
      - power
    question: What are the effort levels in Claude Code after the v2.1.72 simplification?
    options:
      a: Four levels — low, medium, high, max — with icons ▲ △ ● ○
      b: Three levels — quick, normal, deep — with symbols ○ ◐ ●
      c: Three levels — low, medium, high — with symbols ○ ◐ ● (max was removed in v2.1.72)
      d: Two levels — fast, thorough — toggled with Alt+T
    correct: c
    explanation: |-
      v2.1.72 simplified effort to **three levels**: low (○), medium (◐), and high (●). The `max` level was removed at that point. Use `/model` with left/right arrow keys to adjust the effort slider, the `effortLevel` setting in `settings.json`, or the `CLAUDE_CODE_EFFORT_LEVEL` environment variable. The symbols provide quick visual reference in the UI. Use `/effort auto` to reset to the default adaptive behavior.

      **Current state (v2.1.220):** the scale grew back. `/effort` now accepts `low`, `medium`, `high`, `xhigh` (added v2.1.111), `max`, and `ultracode`; `max` and `ultracode` apply to the current session only. Available levels depend on the model.
      ---
    doc_reference:
      file: guide/core/claude-code-releases.md
      section: v2.1.72 (2026-03-09)
      anchor: "#v2172-2026-03-09"
  - id: 10-023
    difficulty: senior
    profiles:
      - senior
      - power
    question: What is "fast mode" for Opus 4.6 and what are its trade-offs?
    options:
      a: A mode that skips permission checks for 2.5x faster execution
      b: Opus 4.6 running at 2.5x faster speed with 6x the price, enabled via /fast or speed:"fast" API parameter
      c: A lightweight Haiku-based mode for simple tasks at reduced cost
      d: Parallel tool execution mode that runs all tool calls simultaneously
    correct: b
    explanation: |-
      Fast mode runs Opus 4.6 at **2.5x faster** speed but at **6x the price** ($30/$150 per 1M tokens vs $5/$25 standard). Enable it in Claude Code via `/fast`, or in the API by adding `speed: "fast"` and the `anthropic-beta: fast-mode-2026-02-01` header. It is the same Opus 4.6 model — same quality, same 1M context support — just optimized for speed at a significant cost premium. Best for time-critical tasks where latency matters more than cost.
      ---
    doc_reference:
      file: guide/ultimate-guide.md
      section: Pricing Model (as of April 2026)
      anchor: "#pricing-model-as-of-april-2026"
  - id: 10-024
    difficulty: senior
    profiles:
      - senior
      - power
    question: What does the restored `model` parameter on the Agent tool enable (v2.1.72)?
    options:
      a: It allows specifying a different model per Agent tool invocation, enabling different sub-agents to use different models
      b: It sets the model for the entire session when passed to the first Agent tool call
      c: It overrides the model used by background cron jobs
      d: It was permanently removed in v2.1.72 and replaced by modelOverrides
    correct: a
    explanation: |-
      The `model` parameter on the Agent tool (restored in v2.1.72) enables **per-invocation model overrides** — you can specify which model each sub-agent uses when spawning it via the Task tool. For example, an orchestrator on Opus 4.6 can spawn a code-review sub-agent on Sonnet for cost efficiency, or a security-audit sub-agent on Opus for thoroughness. This parameter was temporarily removed in a previous release and is now back with the same behavior as before.
      ---
    doc_reference:
      file: guide/core/claude-code-releases.md
      section: v2.1.72 (2026-03-09)
      anchor: "#v2172-2026-03-09"
  - id: 10-025
    difficulty: junior
    profiles:
      - junior
      - senior
      - power
    question: What actionable information does the updated `/context` command now provide (v2.1.74)?
    options:
      a: A list of all active MCP server connections with ping times
      b: Actionable suggestions — context-heavy tools, memory bloat warnings, and optimization tips
      c: The full session transcript compressed to a summary
      d: A breakdown of token usage by file type
    correct: b
    explanation: |-
      The v2.1.74 `/context` command upgrade added **actionable suggestions** alongside the existing context usage display. It identifies context-heavy tools consuming disproportionate tokens, flags memory bloat, surfaces capacity warnings, and provides specific optimization tips to reduce context usage. This makes `/context` not just a passive meter but an active advisor for managing context health during long sessions.
      ---
    doc_reference:
      file: guide/core/claude-code-releases.md
      section: v2.1.74 (2026-03-12)
      anchor: "#v2174-2026-03-12"
  - id: 10-026
    difficulty: junior
    profiles:
      - junior
      - pm
    question: What does Claude Code's fast mode actually do to the model being used?
    options:
      a: It switches the session to Haiku 4.5 for the rest of the conversation to reduce latency
      b: It disables extended thinking entirely to cut response time, regardless of model
      c: It runs the same model, currently Opus, at roughly 2.5x the speed for about 2x the token price; it does not switch to a smaller model
      d: It routes requests through a regional low-latency API endpoint at the same price as standard mode
    correct: c
    explanation: Fast mode runs the current Opus model at faster output speed, roughly 2.5x faster, at about 2x the standard token price. It is the same model, not a downgrade to Haiku, and it does not touch the extended-thinking setting or route through a different endpoint.
    doc_reference:
      file: guide/ultimate-guide.md
      section: Pricing Model
  - id: 10-027
    difficulty: intermediate
    profiles:
      - power
    question: What does setting CLAUDE_CODE_DISABLE_MOUSE_CLICKS do in the terminal UI?
    options:
      a: Disables mouse click, drag, and hover handling in fullscreen mode, while wheel scroll keeps working
      b: Disables wheel scroll only, forcing keyboard-only navigation everywhere
      c: Disables the entire mouse subsystem, including outside fullscreen views
      d: Hides the mouse cursor without changing any click behavior
    correct: a
    explanation: The env var disables mouse click, drag, and hover in fullscreen mode specifically, while keeping wheel scroll functional. It doesn't touch scroll behavior, doesn't extend outside fullscreen mode, and doesn't affect cursor visibility.
    doc_reference:
      file: guide/core/claude-code-releases.md
      section: v2.1.195
  - id: 10-028
    difficulty: junior
    profiles:
      - junior
      - senior
      - power
    question: What keyboard shortcut cycles into Plan Mode?
    options:
      a: Ctrl+P
      b: Shift+Tab
      c: Alt+P
      d: Ctrl+Shift+P
    correct: b
    explanation: |-
      `Shift+Tab` cycles the permission mode: Manual, then acceptEdits, then Plan.

      Plan Mode navigation:
      - `Shift+Tab` from Manual: switch to acceptEdits
      - `Shift+Tab` twice from Manual: reach Plan Mode
      - `Shift+Tab` again: leave Plan Mode without approving the plan

      There is no "Execute Mode": approving the plan drops you into the mode the approval option names.

      Plan Mode allows safe, read-only exploration before making changes.
    doc_reference:
      file: guide/ultimate-guide.md
      section: 10.2 Keyboard Shortcuts
      anchor: "#session-control"
