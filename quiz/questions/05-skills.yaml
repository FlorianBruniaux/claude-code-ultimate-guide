  - id: 05-024
    difficulty: senior
    profiles:
      - senior
      - power
    question: What does NVIDIA's open-source SkillSpector tool check before you install a Claude Code skill?
    options:
      a: Static analysis of a skill file or repository, checked against 64 patterns across 16 categories, before it's installed
      b: Runtime monitoring of a skill's network calls while it executes
      c: A live vulnerability scan of your entire Claude Code configuration and installed MCP servers
      d: An automated fixer that patches vulnerable skills in place
    correct: a
    explanation: SkillSpector performs static analysis, regex and AST inspection, on a skill file or repository, checking it against 64 known malicious or risky patterns across 16 categories such as prompt injection, data exfiltration, and MCP tool poisoning, before the skill touches your machine. It does not monitor runtime network calls, does not scan your live configuration, and does not auto-patch anything, it only scores and reports.
    doc_reference:
      file: guide/ecosystem/third-party-tools.md
      section: SkillSpector
  - id: 05-025
    difficulty: senior
    profiles:
      - senior
      - power
    question: Where should the boundary sit between a skill and an automation harness?
    options:
      a: Keep every repeated workflow in SKILL.md because numbered steps guarantee execution order
      b: Keep interpretation in a skill, but move required ordering, retries, stop rules, and artifact checks into a hook, script, CI job, or workflow harness
      c: Move all judgment into a deterministic script so the model cannot adapt
      d: Use an agent whenever a workflow contains more than one step
    correct: b
    explanation: Use a skill when the model must interpret context, resolve ambiguity, or adapt a procedure. Put required ordering, preconditions, retries, hard stops, and artifact checks in a hook, script, CI job, or dynamic workflow. A numbered list guides the model; it does not guarantee that the controls ran.
    doc_reference:
      file: guide/ultimate-guide.md
      section: 5.1 Skills vs Agents
      anchor: "#decision-tree-which-to-use"
  - id: 05-026
    difficulty: senior
    profiles:
      - senior
      - power
    question: What evidence does `/skill-doctor` provide, and what are its current limits?
    options:
      a: It scans every skill, including bundled and enterprise skills, in local and Remote Control sessions
      b: It proves that every never-invoked skill is safe to delete
      c: It reports visible skill context cost and never-invoked skills in the terminal, with scope and availability limits
      d: It archives unused skills outside discovery paths automatically
    correct: c
    explanation: "`/skill-doctor` reports context cost for visible skills and flags skills that have never been invoked. It requires Claude Code v2.1.252 or later, excludes bundled and enterprise skills, depends on feature-flag fetching, and is unavailable through Remote Control. Treat the unused flag as a review signal and combine it with representative sessions, dependencies, and risk."
    doc_reference:
      file: guide/ultimate-guide.md
      section: 5.X Skill Lifecycle & Retirement
      anchor: "#5x-skill-lifecycle-retirement"
  - id: 05-027
    difficulty: power
    profiles:
      - power
    question: What can Skill Evals support, and what do they not prove?
    options:
      a: A passing eval proves the skill is correct for every model, repository, and future prompt
      b: Benchmark and A/B results support a scoped comparison; Trigger Tuning measures routing; independent validators and qualified human review strengthen the evidence
      c: An LLM judge is independent evidence because it cannot share the tested model's blind spots
      d: Activation accuracy proves output quality, so task assertions are optional
    correct: b
    explanation: Benchmark Mode records pass rates, elapsed time, and token usage across isolated cases. A/B Testing compares two skill versions without telling the judge which is which. Trigger Tuning targets false positives and false negatives in activation. These artifacts support a scoped comparison; they do not prove universal correctness or remove model variance. Record the model, client version, prompts, assertions, run count, failures, and cost, then add deterministic checks or qualified human review where the risk warrants it.
    doc_reference:
      file: guide/ultimate-guide.md
      section: 5.Y Skill Evals
      anchor: "#5y-skill-evals"
