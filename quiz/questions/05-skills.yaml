  - id: 05-024
    difficulty: senior
    profiles:
      - senior
      - power
    question: What does NVIDIA's open-source SkillSpector tool check before you install a Claude Code skill?
    options:
      a: Static analysis of a skill file or repository, checked against 64 patterns across 16 categories, before it's installed
      b: Runtime monitoring of a skill's network calls while it executes
      c: A live vulnerability scan of your entire Claude Code configuration and installed MCP servers
      d: An automated fixer that patches vulnerable skills in place
    correct: a
    explanation: SkillSpector performs static analysis, regex and AST inspection, on a skill file or repository, checking it against 64 known malicious or risky patterns across 16 categories such as prompt injection, data exfiltration, and MCP tool poisoning, before the skill touches your machine. It does not monitor runtime network calls, does not scan your live configuration, and does not auto-patch anything, it only scores and reports.
    doc_reference:
      file: guide/ecosystem/third-party-tools.md
      section: SkillSpector
  - id: 05-025
    difficulty: senior
    profiles:
      - senior
      - power
    question: In the Skills 2.0 taxonomy, what distinguishes a Capability Uplift skill from an Encoded Preference skill, and which type stays durable as models improve?
    options:
      a: Capability Uplift skills are for junior developers; Encoded Preference skills are for senior developers
      b: Capability Uplift fills gaps in the model's current abilities and becomes less necessary as models improve; Encoded Preference encodes team workflow decisions and stays durable over time
      c: Capability Uplift runs faster; Encoded Preference produces higher quality output
      d: Capability Uplift is triggered automatically; Encoded Preference requires manual invocation
    correct: b
    explanation: The Skills 2.0 taxonomy separates skills by their relationship to model improvement. Capability Uplift skills compensate for current model limitations — things the model cannot do well yet. As models get stronger, these skills become redundant and should be retired. Encoded Preference skills encode team-specific workflow decisions (naming conventions, review checklists, deployment conventions). These preferences are not things a better model will automatically know, so they stay durable regardless of model version.
    doc_reference:
      file: guide/ultimate-guide.md
      section: 5.0 Two Kinds of Skills
      anchor: "#50-two-kinds-of-skills"
  - id: 05-026
    difficulty: senior
    profiles:
      - senior
      - power
    question: What are the three phases of the Skill Lifecycle, and what does the retirement checklist address?
    options:
      a: Create, Deploy, Monitor — the checklist covers security scanning
      b: Draft, Review, Publish — the checklist covers documentation completeness
      c: Catch Regressions, Spot Outgrowth, and Retirement — the checklist ensures safe removal without breaking team workflows
      d: Install, Configure, Uninstall — the checklist covers dependency cleanup
    correct: c
    explanation: "The Skill Lifecycle has three phases. Catch Regressions: run skill-specific tests after every Claude model update, because model changes can alter how skills trigger or perform. Spot Outgrowth: periodically check whether the model now handles the skill's job natively — Capability Uplift skills are the most likely candidates. Retirement: the checklist covers verifying no active workflows depend on the skill, communicating the removal to the team, and confirming the model handles the use case adequately before deleting. Skipping the retirement checklist is how teams accidentally break automated pipelines."
    doc_reference:
      file: guide/ultimate-guide.md
      section: 5.X Skill Lifecycle & Retirement
      anchor: "#5x-skill-lifecycle-retirement"
  - id: 05-027
    difficulty: power
    profiles:
      - power
    question: What are the three Skill Eval approaches, and what specific problem does Trigger Tuning address?
    options:
      a: Unit testing, integration testing, end-to-end testing — Trigger Tuning reduces false positives in unit tests
      b: Benchmark Mode (skill vs no-skill comparison), A/B Testing (parallel execution paths), and Trigger Tuning — Trigger Tuning adjusts the skill description to improve auto-invocation rate when Claude should use the skill but doesn't
      c: Code review, peer review, automated review — Trigger Tuning aligns skill output with team style guides
      d: Alpha, beta, production — Trigger Tuning controls which user segments receive the skill
    correct: b
    explanation: "Skill Evals use three approaches. Benchmark Mode compares outputs with the skill active versus without it, giving a measurable quality delta. A/B Testing runs both paths in parallel on real tasks to measure impact under actual conditions. Trigger Tuning addresses a specific failure mode: the skill exists and works correctly, but Claude does not invoke it when it should. Adjusting the skill description to more precisely match the language and context of the target task improves auto-invocation rate without changing the skill's logic."
    doc_reference:
      file: guide/ultimate-guide.md
      section: 5.Y Skill Evals
      anchor: "#5y-skill-evals"
