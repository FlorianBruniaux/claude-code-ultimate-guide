source_file: guide/ultimate-guide.md
questions:
  - id: 05-001
    difficulty: junior
    profiles:
      - junior
      - senior
      - power
      - pm
    question: What is the relationship between Skills and Agents?
    options:
      a: Skills replace agents
      b: Skills are knowledge packages that agents can inherit
      c: Agents are a type of skill
      d: They are completely independent
    correct: b
    explanation: Skills are knowledge packages that agents can inherit. While agents are specialized roles (task-focused), skills are reusable knowledge modules (domain-focused). Multiple agents can inherit the same skill, avoiding duplication. For example, both a code-reviewer and security-auditor agent can inherit the security-guardian skill.
    doc_reference:
      file: guide/ultimate-guide.md
      section: 5.1 Understanding Skills
      anchor: "#51-understanding-skills"
  - id: 05-002
    difficulty: junior
    profiles:
      - junior
      - senior
      - power
    question: How should storage reflect a skill's ownership scope?
    options:
      a: Store every skill in ~/.claude/skills/ so all projects receive it
      b: Use .claude/skills/{skill-name}/ for a project-owned skill and ~/.claude/skills/{skill-name}/ for a personal skill
      c: Use .claude/agents/ for team skills and .claude/commands/ for personal skills
      d: The location does not affect ownership or discovery
    correct: b
    explanation: Store a project or team skill under `.claude/skills/{skill-name}/` so the repository can carry its owner, review path, and assumptions. Store a personal skill under `~/.claude/skills/{skill-name}/`. Both locations are valid, but they declare different ownership boundaries. Each directory requires a `SKILL.md` file.
    doc_reference:
      file: guide/ultimate-guide.md
      section: 5.2 Creating Skills
      anchor: "#52-creating-skills"
  - id: 05-003
    difficulty: senior
    profiles:
      - senior
      - power
    question: What is the REQUIRED file in a skill folder?
    options:
      a: README.md
      b: skill.yaml
      c: SKILL.md
      d: index.md
    correct: c
    explanation: "SKILL.md is the required main file in every skill folder. Optional files include: reference.md (detailed documentation), checklists/ (verification lists), examples/ (code patterns with good/bad examples), and scripts/ (helper scripts). SKILL.md contains the frontmatter and core instructions for the skill."
    doc_reference:
      file: guide/ultimate-guide.md
      section: 5.2 Creating Skills
      anchor: "#skill-folder-structure"
  - id: 05-004
    difficulty: junior
    profiles:
      - junior
      - senior
      - power
    question: What is the key difference between Skills, Agents, and Commands (CC 2.1.3+)?
    options:
      a: They all do the same thing
      b: Skills = knowledge modules (user-invocable or auto), Agents = specialized roles (delegated), Commands = user-invocable skills with disable-model-invocation true
      c: Commands are the only reusable component
      d: Agents cannot use skills or commands
    correct: b
    explanation: |-
      Since CC 2.1.3, the distinction is: Skills are knowledge modules that can be either user-invocable (formerly "commands") or auto-invoked by the model. Agents are specialized roles that Claude delegates tasks to (like a security reviewer). "Commands" are now simply user-invocable skills (skills with `disable-model-invocation: true` in their frontmatter), stored in `.claude/skills/` like all other skills.

      In practice: Skills with `disable-model-invocation: true` behave like the old commands (triggered by `/name`). Skills without that flag auto-load when context matches. Agents inherit skills and have their own persistent memory. They can be combined: agents inherit model-invocable skills, and users invoke user-invocable skills via `/name`.
    doc_reference:
      file: guide/ultimate-guide.md
      section: Skills vs Agents
      anchor: "#skills-vs-agents"
  - id: 05-005
    difficulty: senior
    profiles:
      - senior
      - power
    question: What does the 'context' field in SKILL.md frontmatter control?
    options:
      a: The context window size
      b: Whether the skill runs in isolated (fork) or shared (inherit) context
      c: The file context to load
      d: Database connection context
    correct: b
    explanation: "The `context` field controls execution context: 'fork' means isolated context (the skill runs independently), 'inherit' means shared context (the skill shares context with the calling agent). Use fork for skills that need clean state, inherit for skills that need access to conversation history and loaded files."
    doc_reference:
      file: guide/ultimate-guide.md
      section: 5.2 Creating Skills
      anchor: "#skillmd-frontmatter"
  - id: 05-006
    difficulty: junior
    profiles:
      - junior
      - senior
      - power
    question: When does a shared skill provide a useful single source of truth?
    options:
      a: Publishing a skill automatically assigns a maintainer
      b: A project-owned skill can remove duplication when its users share an owner, review path, and assumptions
      c: Every agent receives every installed skill update automatically
      d: Duplication is always worse than a generic shared skill
    correct: b
    explanation: A project-owned skill can remove duplication when the repository defines who maintains it, how changes are reviewed, and which assumptions its consumers share. Publishing or installing a skill does not create that contract. A local fork or specialized copy may be safer than a generic artifact full of branches for incompatible contexts.
    doc_reference:
      file: guide/ultimate-guide.md
      section: 5.1 Understanding Skills
      anchor: "#why-skills"
  - id: 05-007
    difficulty: senior
    profiles:
      - senior
      - power
    question: What makes a GOOD skill versus a BAD skill?
    options:
      a: Good skills are longer, bad skills are shorter
      b: Good skills are reusable, domain-focused, and include reference material; bad skills are single-agent specific and too broad
      c: Good skills use opus, bad skills use haiku
      d: Good skills have more files
    correct: b
    explanation: "Good skills are: reusable across multiple agents, domain-focused (not too broad), contain reference material and checklists, and include verification steps. Bad skills are: specific to only one agent, too broad in scope, just instructions without reference material, and missing verification checklists."
    doc_reference:
      file: guide/ultimate-guide.md
      section: 5.1 Understanding Skills
      anchor: "#what-makes-a-good-skill"
  - id: 05-008
    difficulty: power
    profiles:
      - power
    question: What is the TDD (Test-Driven Development) skill's core methodology?
    options:
      a: Write tests after code
      b: RED (failing test) -> GREEN (minimal code to pass) -> REFACTOR (improve while green)
      c: Write all tests first, then all code
      d: Skip tests for speed
    correct: b
    explanation: "The TDD skill follows: 1) RED - write a failing test for desired behavior BEFORE code, 2) GREEN - write MINIMUM code to make the test pass, 3) REFACTOR - improve implementation while keeping tests green, then repeat. This cycle ensures tests actually verify behavior by requiring failure first, then incremental improvement."
    doc_reference:
      file: guide/ultimate-guide.md
      section: 5.4 Skill Examples
      anchor: "#example-2-tdd-skill"
  - id: 05-009
    difficulty: senior
    profiles:
      - senior
      - power
    question: What should a Security Guardian skill include for OWASP coverage?
    options:
      a: Just a list of vulnerabilities
      b: Checklists for each OWASP Top 10 category with specific verification items
      c: Links to external security tools
      d: Password examples
    correct: b
    explanation: "A Security Guardian skill should include detailed checklists for each OWASP Top 10 category: A01 Broken Access Control (check authorization, IDOR, privilege escalation), A02 Cryptographic Failures (hardcoded secrets, TLS, password hashing), A03 Injection (SQL, NoSQL, XSS), etc. Each category should have specific verification items with checkboxes."
    doc_reference:
      file: guide/ultimate-guide.md
      section: 5.4 Skill Examples
      anchor: "#example-1-security-guardian-skill"
  - id: 05-010
    difficulty: junior
    profiles:
      - junior
      - senior
      - power
    question: What is the 'agent' field in SKILL.md frontmatter?
    options:
      a: Which agent created the skill
      b: "Which subagent type (Explore, Plan, general-purpose, or a custom .claude/agents/ subagent) to use when context: fork is set"
      c: The agent that must use this skill
      d: The agent's name
    correct: b
    explanation: "The `agent` field selects which subagent type runs the skill when `context: fork` is set. Accepted values are the built-in agents (Explore, Plan, general-purpose) or any custom subagent from `.claude/agents/`; if omitted, it defaults to general-purpose. It has no effect unless paired with `context: fork`, and has nothing to do with a 'specialist' versus 'general' classification."
    doc_reference:
      file: guide/ultimate-guide.md
      section: 5.2 Creating Skills
      anchor: "#skillmd-frontmatter"
  - id: 05-011
    difficulty: power
    profiles:
      - power
    question: What does the `allowed-tools` field in skill frontmatter control?
    options:
      a: Tools the skill documents
      b: Tools or command patterns pre-approved for the turn that invokes the skill
      c: Tools that can activate the skill
      d: A permanent sandbox that blocks every unlisted tool
    correct: b
    explanation: "The `allowed-tools` field pre-approves matching tools or scoped commands for the turn that invokes the skill. For example, `allowed-tools: Read Grep Bash(npm run *)` narrows what runs without another permission prompt. It is not an exclusive allowlist or sandbox: other tools remain governed by session permissions. Use `disallowed-tools` for turn-scoped removal and project deny rules for persistent restrictions."
    doc_reference:
      file: guide/ultimate-guide.md
      section: 5.2 Creating Skills
      anchor: "#skillmd-frontmatter"
  - id: 05-012
    difficulty: senior
    profiles:
      - senior
      - power
    question: What optional folders can a skill directory contain?
    options:
      a: Only SKILL.md is allowed
      b: reference.md, checklists/, examples/, and scripts/
      c: src/, dist/, and node_modules/
      d: tests/, docs/, and config/
    correct: b
    explanation: "A skill directory can contain: SKILL.md (required), reference.md (detailed documentation), checklists/ (verification lists like security.md, performance.md), examples/ (code patterns like good-example.ts, bad-example.ts), and scripts/ (helper scripts like audit.sh). This rich structure supports comprehensive domain knowledge."
    doc_reference:
      file: guide/ultimate-guide.md
      section: 5.2 Creating Skills
      anchor: "#skill-folder-structure"
  - id: 05-013
    difficulty: junior
    profiles:
      - junior
      - senior
      - power
    question: In the Security Guardian skill, what is an example of GOOD password hashing?
    options:
      a: md5(password)
      b: sha1(password)
      c: argon2 or bcrypt
      d: Base64 encoding
    correct: c
    explanation: "The Security Guardian skill shows argon2 or bcrypt as secure password hashing. BAD examples explicitly listed: md5(password) and sha1(password) - these are cryptographically broken for password storage. Good pattern: `const hashedPassword = await hash(password)` using argon2 library. Always verify password with `await verify(hashedPassword, inputPassword)`."
    doc_reference:
      file: guide/ultimate-guide.md
      section: 5.4 Skill Examples
      anchor: "#54-skill-examples"
  - id: 05-014
    difficulty: senior
    profiles:
      - senior
      - power
    question: What is the AAA pattern in TDD testing?
    options:
      a: Ask, Answer, Assert
      b: Arrange, Act, Assert
      c: Analyze, Apply, Approve
      d: Accept, Adjust, Acknowledge
    correct: b
    explanation: "AAA stands for Arrange, Act, Assert: 1) Arrange - set up test data and preconditions, 2) Act - execute the code being tested, 3) Assert - verify the result matches expectations. Example: Arrange items array, Act by calling calculateTotal(items), Assert that total equals expected value. This structure makes tests readable and maintainable."
    doc_reference:
      file: guide/ultimate-guide.md
      section: 5.4 Skill Examples
      anchor: "#test-structure-aaa-pattern"
  - id: 05-015
    difficulty: power
    profiles:
      - power
    question: What community skill repository focuses on cybersecurity and penetration testing?
    options:
      a: awesome-claude-skills
      b: claude-security-pack
      c: zebbern/claude-code-guide with 29 cybersecurity skills
      d: owasp-claude-skills
    correct: c
    explanation: "The zebbern/claude-code-guide repository contains 29 cybersecurity-focused skills covering: penetration testing (SQL injection, XSS, IDOR), security tools (Metasploit, Burp Suite, SQLMap), infrastructure security (AWS, Cloud, Network), and methodologies (ethical hacking, pentest checklists). Important: these should be tested thoroughly and used only with proper authorization."
    doc_reference:
      file: guide/ultimate-guide.md
      section: 5.5 Community Skill Repositories
      anchor: "#cybersecurity-skills-repository"
  - id: 05-016
    difficulty: junior
    profiles:
      - junior
      - senior
      - power
    question: What should skills include to be most useful?
    options:
      a: Only theory and concepts
      b: Checklists, good/bad code examples, and methodology steps
      c: Links to external websites
      d: Marketing descriptions
    correct: b
    explanation: "Useful skills include: methodology steps (clear process to follow), checklists (verification items with checkboxes), good/bad code examples (showing correct patterns and anti-patterns), and reference material. This combination provides both theoretical knowledge and practical guidance that agents can apply directly to tasks."
    doc_reference:
      file: guide/ultimate-guide.md
      section: 5.3 Skill Template
      anchor: "#53-skill-template"
  - id: 05-017
    difficulty: senior
    profiles:
      - senior
      - power
    question: How do you reference a skill in an agent's frontmatter?
    options:
      a: "import: skill-name"
      b: "skills: [skill-name]"
      c: "use: skill-name"
      d: "require: skill-name"
    correct: b
    explanation: "Reference skills in an agent's frontmatter using the `skills` array: `skills: [security-guardian, tdd]`. This makes the agent inherit all knowledge from those skills. You can reference multiple skills, and the agent combines their expertise. The skill name matches the folder name in `.claude/skills/`."
    doc_reference:
      file: guide/ultimate-guide.md
      section: 4.4 Best Practices
      anchor: "#skill-composition"
  - id: 05-018
    difficulty: power
    profiles:
      - power
    question: What disclaimer applies to community cybersecurity skills?
    options:
      a: They are officially certified
      b: Test thoroughly, ensure authorization, verify against policies, use only legally
      c: They work on all systems
      d: No disclaimer needed
    correct: b
    explanation: Test community cybersecurity skills before production use, review their instructions, supporting files, scripts, dependencies, and tool grants, and confirm that the work is authorized in writing. A catalog rating or repository popularity does not replace review of the exact version you invoke.
    doc_reference:
      file: guide/ultimate-guide.md
      section: 5.5 Community Skill Repositories
      anchor: "#important-disclaimer"
  - id: 05-019
    difficulty: senior
    profiles:
      - senior
      - power
    question: Which four ownership scopes should you distinguish before distributing a skill?
    options:
      a: Local, remote, managed, and unmanaged
      b: Free, paid, open source, and proprietary
      c: Personal, project or team, tool or vendor, and marketplace or global
      d: Prompt, agent, hook, and MCP
    correct: c
    explanation: Choose between personal, project or team, tool or vendor, and marketplace or global scope before selecting a distribution channel. Each scope carries a different compatibility and maintenance expectation. Public distribution supports discovery, but does not create shared ownership.
    doc_reference:
      file: guide/ultimate-guide.md
      section: Ownership and Reuse Governance
      anchor: "#ownership-and-reuse-governance"
  - id: 05-020
    difficulty: senior
    profiles:
      - senior
      - power
    question: What is the "Spot Outgrowth" pattern in skill lifecycle management?
    options:
      a: When a skill grows too large and needs to be split
      b: When the model passes representative evals without the skill, making it a retirement candidate that still needs a risk and dependency review
      c: When a skill triggers too often and needs to be throttled
      d: When a skill is adopted by the wider community
    correct: b
    explanation: Spot Outgrowth occurs when the model passes representative evals without a Capability Uplift skill. That result makes the skill a retirement candidate; it does not prove safe deletion. Check active workflow dependencies, usage evidence, task frequency, and failure severity, then disable the skill and compare sessions before retiring it.
    doc_reference:
      file: guide/ultimate-guide.md
      section: 5.X Skill Lifecycle & Retirement
      anchor: "#5x-skill-lifecycle-retirement"
  - id: 05-021
    difficulty: power
    profiles:
      - power
    question: What does Trigger Tuning (Description Optimizer) do in Skill Evals?
    options:
      a: It adjusts the timing of when skills are loaded into context
      b: It compresses skill descriptions to reduce token usage
      c: It automatically runs all skill tests on a schedule
      d: It analyzes and improves the skill's description field to reduce false positives and false negatives in skill activation
    correct: d
    explanation: Trigger Tuning analyzes a skill's `description` and suggests changes intended to reduce false positives and false negatives in activation. It evaluates routing, not output quality. A skill can trigger at the right time and still produce an incorrect result, so test activation and task assertions separately.
    doc_reference:
      file: guide/ultimate-guide.md
      section: 5.Y Skill Evals
      anchor: "#5y-skill-evals"
  - id: 05-022
    difficulty: intermediate
    profiles:
      - junior
      - senior
      - power
    question: If you type /skill-a /skill-b do XYZ in a single prompt, what happens as of v2.1.199?
    options:
      a: Only the first skill mentioned is loaded, the rest are treated as plain text
      b: All leading skills are loaded, up to a maximum of 5
      c: All leading skills are loaded with no limit on how many
      d: Stacking skill invocations in one prompt is not supported and raises an error
    correct: b
    explanation: As of v2.1.199, stacked slash-skill invocations load all leading skills mentioned at the start of the prompt, up to a maximum of 5, instead of loading only the first one. Before this change, only the first skill would have been recognized. Option c is wrong since there is a cap, and option d is wrong since stacking is explicitly supported.
    doc_reference:
      file: guide/core/claude-code-releases.md
      section: v2.1.199
