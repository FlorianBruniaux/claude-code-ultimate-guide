    question: What does the /dataviz skill, added as a bundled skill in v2.1.198, help with?
    options:
      a: A skill for writing SQL migration scripts
      b: A skill for generating unit test scaffolding
      c: A skill for chart and dashboard design guidance, with a runnable color-palette validator
      d: A skill for auditing accessibility compliance on web pages
    correct: c
    explanation: The /dataviz skill provides chart and dashboard design guidance, including a runnable color-palette validator. It's unrelated to SQL, testing, or accessibility, which are plausible bundled-skill topics but not what /dataviz covers.
