      anchor: "#cybersecurity-skills-repository"
  - id: 05-016
    difficulty: junior
    profiles:
      - junior
      - senior
      - power
    question: What should skills include to be most useful?
    options:
      a: Only theory and concepts
      b: Checklists, good/bad code examples, and methodology steps
      c: Links to external websites
      d: Marketing descriptions
    correct: b
    explanation: "Useful skills include: methodology steps (clear process to follow), checklists (verification items with checkboxes), good/bad code examples (showing correct patterns and anti-patterns), and reference material. This combination provides both theoretical knowledge and practical guidance that agents can apply directly to tasks."
    doc_reference:
      file: guide/ultimate-guide.md
      section: 5.3 Skill Template
      anchor: "#53-skill-template"
  - id: 05-017
    difficulty: senior
    profiles:
      - senior
      - power
    question: How do you reference a skill in an agent's frontmatter?
    options:
      a: "import: skill-name"
      b: "skills: [skill-name]"
      c: "use: skill-name"
      d: "require: skill-name"
    correct: b
    explanation: "Reference skills in an agent's frontmatter using the `skills` array: `skills: [security-guardian, tdd]`. This makes the agent inherit all knowledge from those skills. You can reference multiple skills, and the agent combines their expertise. The skill name matches the folder name in `.claude/skills/`."
    doc_reference:
      file: guide/ultimate-guide.md
      section: 4.4 Best Practices
      anchor: "#skill-composition"
  - id: 05-018
    difficulty: power
    profiles:
      - power
    question: What disclaimer applies to community cybersecurity skills?
    options:
      a: They are officially certified
      b: Test thoroughly, ensure authorization, verify against policies, use only legally
      c: They work on all systems
      d: No disclaimer needed
    correct: b
    explanation: "Community cybersecurity skills come with important disclaimers: test thoroughly before using in production assessments, ensure you have proper authorization before penetration testing, review and validate against your organization's security policies, use only in legal contexts with written permission from system owners, and contribute back if you find issues. Verification is essential for any security tooling."
    doc_reference:
      file: guide/ultimate-guide.md
      section: 5.5 Community Skill Repositories
      anchor: "#important-disclaimer"
  - id: 05-019
    difficulty: senior
    profiles:
      - senior
      - power
    question: What are the two types of skills introduced in Skills 2.0 (March 2026)?
    options:
      a: Active skills and Passive skills
      b: Manual skills and Automatic skills
      c: Capability Uplift skills and Encoded Preference skills
      d: Model skills and Workflow skills
    correct: c
    explanation: "Skills 2.0 formalizes two distinct types: **Capability Uplift** skills fill a gap the base model can't handle consistently (e.g., precise PDF text placement). They fade over time as the model improves and should be monitored with evals. **Encoded Preference** skills sequence existing capabilities your team's specific way (e.g., NDA review against your legal criteria). They stay durable as long as the underlying workflow remains relevant."
    doc_reference:
      file: guide/ultimate-guide.md
      section: 5.0 Two Kinds of Skills
      anchor: "#50-two-kinds-of-skills"
  - id: 05-020
    difficulty: senior
    profiles:
      - senior
      - power
    question: What is the "Spot Outgrowth" pattern in skill lifecycle management?
    options:
      a: When a skill grows too large and needs to be split
      b: When the model improves to the point where it passes the skill's eval without the skill, signaling the skill can be retired
      c: When a skill triggers too often and needs to be throttled
      d: When a skill is adopted by the wider community
    correct: b
    explanation: "Spot Outgrowth occurs when a model improves to the point where it can pass a skill's eval on its own, without the skill being loaded. This is the retirement signal for Capability Uplift skills: run the eval without the skill — if it passes, the skill is no longer needed. Removing it reduces context load and maintenance overhead. This contrasts with \"Catch Regressions,\" which detects when a skill drifts after a model update."
    doc_reference:
      file: guide/ultimate-guide.md
      section: 5.X Skill Lifecycle & Retirement
      anchor: "#5x-skill-lifecycle-retirement"
  - id: 05-021
    difficulty: power
    profiles:
      - power
    question: What does Trigger Tuning (Description Optimizer) do in Skill Evals?
    options:
      a: It adjusts the timing of when skills are loaded into context
      b: It compresses skill descriptions to reduce token usage
      c: It automatically runs all skill tests on a schedule
      d: It analyzes and improves the skill's description field to reduce false positives and false negatives in skill activation
    correct: d
    explanation: "Trigger Tuning analyzes your skill's `description` field and suggests improvements to reduce two types of triggering errors: false positives (skill fires when it shouldn't) and false negatives (skill doesn't fire when it should). As skill libraries grow, descriptions can conflict and cause unreliable activation. According to Anthropic's internal testing, 5 of 6 document-creation skills showed improved triggering accuracy after optimization. [Source: claudecode.jp — directional]"
    doc_reference:
      file: guide/ultimate-guide.md
      section: 5.Y Skill Evals
      anchor: "#5y-skill-evals"
  - id: 05-022
    difficulty: intermediate
    profiles:
      - junior
      - senior
      - power
    question: If you type /skill-a /skill-b do XYZ in a single prompt, what happens as of v2.1.199?
    options:
      a: Only the first skill mentioned is loaded, the rest are treated as plain text
      b: All leading skills are loaded, up to a maximum of 5
      c: All leading skills are loaded with no limit on how many
      d: Stacking skill invocations in one prompt is not supported and raises an error
    correct: b
    explanation: As of v2.1.199, stacked slash-skill invocations load all leading skills mentioned at the start of the prompt, up to a maximum of 5, instead of loading only the first one. Before this change, only the first skill would have been recognized. Option c is wrong since there is a cap, and option d is wrong since stacking is explicitly supported.
    doc_reference:
      file: guide/core/claude-code-releases.md
      section: v2.1.199
