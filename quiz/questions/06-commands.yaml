questions:
  - id: 06-001
    difficulty: junior
    profiles:
      - junior
      - senior
      - power
    question: Where should custom commands (user-invocable skills) be placed to make them available in Claude Code?
    options:
      a: ~/.claude/skills/
      b: .claude/skills/
      c: /usr/local/claude/commands/
      d: .claude/config/commands/
    correct: b
    explanation: |-
      Since CC 2.1.3, custom slash commands live in `.claude/skills/` as user-invocable skills. Each command is a folder with a `SKILL.md` file that includes `disable-model-invocation: true` in the frontmatter.

      This allows project-specific commands that can be committed with your codebase.
      The global directory `~/.claude/skills/` is for personal commands available across all projects.

      Skills are organized in subdirectories:
      - `.claude/skills/tech/deploy/` for development workflows
      - `.claude/skills/product/scope/` for product workflows
    doc_reference:
      file: guide/ultimate-guide.md
      section: 6.2 Creating Custom Commands
      anchor: "#62-creating-custom-commands"
  - id: 06-002
    difficulty: junior
    profiles:
      - junior
      - senior
      - power
    question: How do you invoke a user-invocable skill named `commit` located in `.claude/skills/tech/commit/`?
    options:
      a: /commit
      b: /tech-commit
      c: /tech:commit
      d: "!tech/commit"
    correct: c
    explanation: |-
      User-invocable skills use the format `/folder:name` based on their directory path under `.claude/skills/`.

      So `.claude/skills/tech/commit/SKILL.md` becomes `/tech:commit`.
      This naming convention allows organizing skills by domain while keeping invocation intuitive.

      Examples:
      - `.claude/skills/tech/pr/SKILL.md` -> `/tech:pr`
      - `.claude/skills/product/scope/SKILL.md` -> `/product:scope`

      Since CC 2.1.3, these skills replace the old `.claude/commands/` files. The `disable-model-invocation: true` flag in the SKILL.md frontmatter ensures they only fire on explicit user invocation.
    doc_reference:
      file: guide/ultimate-guide.md
      section: 6.2 Creating Custom Commands
      anchor: "#command-naming"
  - id: 06-003
    difficulty: senior
    profiles:
      - senior
      - power
    question: What variable is used in command files to access arguments passed to the command?
    options:
      a: $ARGS
      b: $INPUT
      c: $ARGUMENTS
      d: $PARAMS
    correct: c
    explanation: |-
      The `$ARGUMENTS` variable contains text passed after the command invocation.

      **Syntax options**:
      - `$ARGUMENTS` → Full argument string
      - `$ARGUMENTS[0]` → First argument
      - `$ARGUMENTS[1]` → Second argument
      - **Shorthand**: `$0`, `$1`, `$2` → Equivalent to `$ARGUMENTS[0]`, `$ARGUMENTS[1]`, `$ARGUMENTS[2]`

      **Example**: `/tech:deploy production staging`
      - `$ARGUMENTS` = `"production staging"`
      - `$0` or `$ARGUMENTS[0]` = `"production"`
      - `$1` or `$ARGUMENTS[1]` = `"staging"`

      Commands should document expected arguments and handle missing values gracefully.
    doc_reference:
      file: guide/ultimate-guide.md
      section: 6.2 Creating Custom Commands
      anchor: "#variable-interpolation"
  - id: 06-004
    difficulty: junior
    profiles:
      - junior
      - senior
      - power
    question: Which built-in command shows all available commands including custom ones?
    options:
      a: /commands
      b: /list
      c: /help
      d: /show
    correct: c
    explanation: |-
      The `/help` command displays all available commands, both built-in and custom.

      Built-in commands include:
      - `/clear` - Clear conversation
      - `/compact` - Summarize context
      - `/status` - Show session info
      - `/plan` - Enter Plan Mode
      - `/rewind` - Undo changes

      User-invocable skills from `.claude/skills/` (with `disable-model-invocation: true`) are also listed here. Since CC 2.1.3, custom slash commands live in `.claude/skills/` rather than `.claude/commands/`.
    doc_reference:
      file: guide/ultimate-guide.md
      section: 6.1 Slash Commands
      anchor: "#61-slash-commands"
  - id: 06-005
    difficulty: senior
    profiles:
      - senior
      - power
    question: What sections should a well-structured command template include according to best practices?
    options:
      a: Purpose, Steps, Output
      b: Purpose, Process, Arguments, Output Format, Examples, Error Handling
      c: Name, Description, Code
      d: Title, Body, Footer
    correct: b
    explanation: |-
      A complete command template should include:

      1. **Purpose** - Brief description of what the command does
      2. **Process** - Step-by-step instructions Claude should follow
      3. **Arguments** - How to handle $ARGUMENTS (if provided/not provided)
      4. **Output Format** - Expected structure of the output
      5. **Examples** - Concrete usage examples
      6. **Error Handling** - How to handle edge cases and failures

      This comprehensive structure ensures consistent, reliable command execution.
    doc_reference:
      file: guide/ultimate-guide.md
      section: 6.3 Command Template
      anchor: "#63-command-template"
  - id: 06-006
    difficulty: junior
    profiles:
      - junior
      - senior
      - power
    question: Which command enters Plan Mode for safe, read-only exploration?
    options:
      a: /safe
      b: /readonly
      c: /plan
      d: /explore
    correct: c
    explanation: |-
      The `/plan` command enters Plan Mode, where Claude can analyze and explore
      the codebase without making any changes.

      This is ideal for:
      - Understanding unfamiliar codebases
      - Architectural analysis before changes
      - Safe exploration of risky operations

      Exit Plan Mode by approving the plan Claude presents, or with `Shift+Tab`.
      There is no `/execute` command in Claude Code.
    doc_reference:
      file: guide/ultimate-guide.md
      section: 6.1 Slash Commands
      anchor: "#built-in-commands"
  - id: 06-007
    difficulty: senior
    profiles:
      - senior
      - power
    question: In the commit command example, what is the recommended commit message format?
    options:
      a: Simple description
      b: "Conventional Commits: type(scope): description"
      c: Date - Author - Message
      d: "JIRA-123: Message"
    correct: b
    explanation: |-
      The guide recommends Conventional Commits format: `type(scope): description`

      Common types:
      - `feat`: New feature
      - `fix`: Bug fix
      - `refactor`: Code restructuring
      - `docs`: Documentation
      - `test`: Test changes
      - `chore`: Maintenance

      This provides consistent, parseable commit history useful for changelogs and releases.
    doc_reference:
      file: guide/ultimate-guide.md
      section: 6.4 Command Examples
      anchor: "#example-1-commit-command"
  - id: 06-008
    difficulty: power
    profiles:
      - power
    question: What technique does the Problem Framer command use to find root causes?
    options:
      a: SWOT Analysis
      b: 5 Whys Analysis
      c: Pareto Analysis
      d: Fishbone Diagram
    correct: b
    explanation: |-
      The Problem Framer command uses the "5 Whys Analysis" technique.

      This involves asking "Why?" five times to drill down to the root cause:
      - Why 1: First answer
      - Why 2: Deeper answer
      - Why 3: Even deeper
      - Why 4: Getting to root
      - Why 5: Root cause

      The command then reframes the problem as: "How might we [action] for [user] so that [outcome]?"
    doc_reference:
      file: guide/ultimate-guide.md
      section: 6.4 Command Examples
      anchor: "#example-3-problem-framer-command"
  - id: 06-009
    difficulty: junior
    profiles:
      - junior
      - senior
      - power
    question: What does the `/rewind` command do?
    options:
      a: Restores a previous git commit
      b: Undoes Claude's recent changes in the current session
      c: Clears the entire conversation history
      d: Rolls back the last command execution
    correct: b
    explanation: |-
      The `/rewind` command undoes Claude's recent changes in the current session.

      Key points:
      - Works only for uncommitted changes made by Claude
      - Does NOT create git commits
      - Use when Claude made a mistake and you want to try a different approach

      For committed changes, use `git revert` instead.
      The keyboard shortcut `Esc×2` (double-tap Escape) also triggers rewind.
    doc_reference:
      file: guide/ultimate-guide.md
      section: 6.1 Slash Commands
      anchor: "#built-in-commands"
  - id: 06-010
    difficulty: senior
    profiles:
      - senior
      - power
    question: What should a PR command's error handling do if the user is NOT on a feature branch?
    options:
      a: Automatically create a feature branch
      b: Proceed anyway with warnings
      c: "WARN: Create a feature branch first"
      d: Exit silently
    correct: c
    explanation: |-
      According to the PR command example, if the user is not on a feature branch,
      the command should WARN: "Create a feature branch first".

      Similarly, if the working directory is dirty, it should ASK: "Commit changes first?"

      Good command design includes clear error handling that:
      - Warns users about prerequisites
      - Suggests corrective actions
      - Prevents accidental mistakes
    doc_reference:
      file: guide/ultimate-guide.md
      section: 6.4 Command Examples
      anchor: "#example-2-pr-command"
  - id: 06-011
    difficulty: power
    profiles:
      - power
    question: What is the recommended order of git commands in a PR creation workflow?
    options:
      a: push, diff, create PR
      b: status, branch, log, diff, push if needed, create PR
      c: add, commit, push, create PR
      d: checkout, status, push, create PR
    correct: b
    explanation: |-
      The recommended PR workflow order is:

      1. `git status` - Verify clean working directory
      2. `git branch` - Confirm on feature branch
      3. `git log main..HEAD` - Review all commits
      4. `git diff main...HEAD` - See all changes vs main
      5. `git push -u origin [branch]` - Push if not already pushed
      6. `gh pr create` - Create the PR

      This thorough process ensures quality PRs with proper context.
    doc_reference:
      file: guide/ultimate-guide.md
      section: 6.4 Command Examples
      anchor: "#example-2-pr-command"
  - id: 06-012
    difficulty: junior
    profiles:
      - junior
      - senior
      - power
    question: How do you reference a file when talking to Claude Code?
    options:
      a: "#filename"
      b: "@filename"
      c: "!filename"
      d: $filename
    correct: b
    explanation: |-
      The `@filename` syntax references a file in your conversation with Claude.

      Quick actions:
      - `@file` - Reference a file
      - `!command` - Run a shell command
      - `Ctrl+C` - Cancel operation
      - `Ctrl+R` - Retry last

      This allows you to easily bring specific files into context for Claude to analyze.
    doc_reference:
      file: guide/ultimate-guide.md
      section: 10.1 Commands Table
      anchor: "#quick-actions"
  - id: 06-013
    difficulty: junior
    profiles:
      - junior
      - senior
      - power
    question: What does the `/loop` command do in Claude Code (v2.1.71+)?
    options:
      a: Repeats the last command once
      b: Enters an infinite conversation loop with no session limit
      c: Runs a prompt or slash command on a recurring interval (e.g., every 5 minutes)
      d: Loops through all files in the current directory
    correct: c
    explanation: |-
      `/loop [interval] [prompt]` runs a prompt or slash command on a recurring schedule. Example: `/loop 5m check the deploy` checks the deployment every 5 minutes until you stop it. This is useful for monitoring tasks, periodic status checks, or recurring automation without leaving Claude Code. The interval can be specified in minutes (`5m`), seconds (`30s`), or hours (`1h`).
      ---
    doc_reference:
      file: guide/ultimate-guide.md
      section: 10.1 Commands Table
      anchor: "#101-commands-table"
  - id: 06-014
    difficulty: senior
    profiles:
      - senior
      - power
    question: What does the `/simplify` command do (v2.1.63+)?
    options:
      a: Reformats code to match project style (equivalent to Prettier)
      b: Reviews recently changed code for over-engineering, duplication, and redundant abstractions, then fixes them
      c: Removes all comments and dead code from the current file
      d: Summarizes the diff since last commit in plain language
    correct: b
    explanation: |-
      `/simplify` reviews your **recently changed code** for over-engineering and redundant abstractions, then fixes the problems it finds. It operates at the architecture and structure level — analyzing for reuse opportunities, quality issues, and efficiency improvements — not at the formatting or linting level. It complements tools like ESLint or Prettier rather than replacing them. Run it after finishing a feature, before opening a pull request: `/simplify` (all changes) or `/simplify focus on error handling` (targeted scope).
      ---
    doc_reference:
      file: guide/ultimate-guide.md
      section: The /simplify Command
      anchor: "#the-simplify-command"
  - id: 06-015
    difficulty: senior
    profiles:
      - senior
      - power
    question: What does the `/batch` command do in Claude Code (v2.1.63+)?
    options:
      a: Runs a single command in batch (non-interactive) mode
      b: Groups multiple pending changes into one commit
      c: Executes all queued agent tasks in sequence
      d: Orchestrates large-scale codebase changes across 5-30 parallel agents in isolated worktrees, each opening its own PR
    correct: d
    explanation: |-
      `/batch` distributes large-scale codebase changes across 5–30 parallel agents in isolated git worktrees. Each agent handles an independent portion of the work and opens its own pull request. The workflow is: (1) research and plan the change, (2) spawn parallel worktree agents, (3) each agent completes its portion and creates a PR. Ideal for migrations like `/batch migrate from react to vue` or `/batch add type annotations to all JavaScript files` — tasks that can be split into independent units.
      ---
    doc_reference:
      file: guide/ultimate-guide.md
      section: The /batch Command
      anchor: "#the-batch-command"
  - id: 06-016
    difficulty: junior
    profiles:
      - junior
      - senior
      - power
    question: What do the `/stats` and `/rename` commands do (added in cheatsheet v3.32.2)?
    options:
      a: /stats shows usage chart + streak; /rename sets a custom name for the current session
      b: /stats shows token costs; /rename renames the last CLAUDE.md file
      c: /stats shows file diff stats; /rename renames the current git branch
      d: Both commands are aliases for /status with different output formats
    correct: a
    explanation: |-
      `/stats` displays a usage chart and streak — a visual summary of your Claude Code activity over time. `/rename [name]` gives the current session a custom name, making it easier to find in `/resume` history. Both were documented in the cheatsheet update alongside `/loop` and `/copy` (from releases v2.1.59–v2.1.71). These are quality-of-life commands for session management and personal usage tracking.
      ---
    doc_reference:
      file: guide/cheatsheet.md
      section: Essential Commands
      anchor: "#essential-commands"
  - id: 06-017
    difficulty: power
    profiles:
      - senior
      - power
    question: As of v2.1.202, what is the difference between /review <pr> and /code-review <level> <pr#>?
    options:
      a: /review <pr> is the multi-agent option, /code-review <level> <pr#> is the fast single-pass option
      b: /review <pr> is a fast single-pass review, /code-review <level> <pr#> runs a multi-agent review at a chosen effort level
      c: They are aliases for the exact same command with no behavioral difference
      d: /review only works on local diffs, /code-review only works on GitHub PRs
    correct: b
    explanation: "In v2.1.202, /review <pr> reverted to being a fast single-pass review, while /code-review <level> <pr#> handles the multi-agent, multi-pass review at a chosen effort level (low through max). This distinction had shifted before: at one point /review <pr> used the same engine as /code-review medium. Option c is wrong since the two now behave differently, and option d invents a local-versus-GitHub split that isn't the actual distinction."
    doc_reference:
      file: guide/core/claude-code-releases.md
      section: v2.1.202
  - id: 06-018
    difficulty: intermediate
    profiles:
      - junior
      - senior
      - power
    question: What happened to the /agents interactive wizard command as of v2.1.198?
    options:
      a: It was merged into /config as a new tab
      b: It was renamed to /subagents but works the same way
      c: It still exists but now requires the --legacy flag
      d: It was removed; subagents are managed by editing .claude/agents/ directly or asking Claude conversationally
    correct: d
    explanation: The /agents wizard was removed in v2.1.198. Subagents are now managed by editing files directly under .claude/agents/ or by asking Claude to create or edit them conversationally, rather than through a dedicated wizard command. It wasn't merged into /config, renamed, or gated behind a flag, it's gone as a standalone interactive flow.
    doc_reference:
      file: guide/core/claude-code-releases.md
      section: v2.1.198
  - id: 06-019
    difficulty: power
    profiles:
      - senior
      - power
    question: As of v2.1.191, can /rewind still recover a conversation after you've run /clear?
    options:
      a: No, running /clear permanently discards the ability to rewind anything before it
      b: Yes, /rewind can resume a conversation from before /clear was run
      c: Only if the session was saved with /save before the /clear
      d: Yes, but only within the same calendar day as the /clear
    correct: b
    explanation: Since v2.1.191, /rewind can resume a conversation from before /clear was run, so clearing the visible context no longer means losing the ability to go back. Before this change, /clear would have effectively been a point of no return for rewind purposes. Options c and d invent conditions, a manual save step and a time window, that the release notes don't mention.
    doc_reference:
      file: guide/core/claude-code-releases.md
      section: v2.1.191
  - id: 06-020
    difficulty: junior
    profiles:
