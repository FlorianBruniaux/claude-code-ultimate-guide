  - id: 11-021
    difficulty: intermediate
    profiles:
      - senior
      - power
    question: A 2025 PLDI study from ETH Zurich and UC Berkeley analyzed compilation errors in LLM-generated code. What did it find, and what practical lesson does the guide draw from it?
    options:
      a: 94% of compilation errors were type errors, which is why strictly typed languages and strict architectural patterns act as a safety net for agent-generated code
      b: 94% of compilation errors were syntax errors, which is why linting should run before every agent commit
      c: LLM-generated code compiled successfully 94% of the time across all languages tested, with no meaningful gap between typed and untyped languages
      d: The study found no correlation between language typing and agent code quality, contradicting the field observations in the guide
    correct: a
    explanation: "The study found that 94% of compilation errors in LLM-generated code were type errors. The guide's practical takeaway is that strictly typed languages and strict architectural patterns, like hexagonal architecture or domain-driven design, act as a safety net because the compiler automatically rejects a large class of agent mistakes. A team's field notes cited in the guide observed this directly: the more structure a codebase imposes, the more consistently agents work within it, which rules out option d's claim of contradiction."
    doc_reference:
      file: guide/roles/adoption-approaches.md
      section: What We Do Know (Empirical Data)
  - id: 11-022
    difficulty: intermediate
    profiles:
      - senior
      - power
      - pm
    question: According to a pattern that nine independent speakers converged on at the same meetup, what happens to context quality as a session approaches its context window budget?
    options:
      a: Quality declines in a straight line from 0% to 100% of the budget, with no particular threshold
      b: Quality is unaffected by budget usage until the window is completely full, at which point the session simply stops
      c: Quality improves as more context accumulates, up to a hard cutoff at 100%
      d: Quality drops sharply around 70% of the budget used, rather than declining gradually, so context should be purged or compacted before hitting that mark
    correct: d
    explanation: "The convergence is on abruptness, not a gradual slope: context quality falls off sharply around 70% of budget used, rather than declining in a straight line. The practical implication is to purge or compact before hitting that mark, since waiting for visible confusion means the threshold has usually already been crossed. Options a, b, and c each describe a smoother or later-onset degradation than what the speakers actually reported."
    doc_reference:
      file: guide/ecosystem/practitioner-insights.md
      section: Context Engineering
  - id: 11-023
    difficulty: senior
    profiles:
      - senior
      - power
      - pm
    question: What is the velocity trap in AI-augmented teams, and why is DORA 'High' on deployment frequency not sufficient evidence of health?
    options:
      a: Teams deploy too slowly because AI adds overhead
      b: High deployment frequency can coexist with burnout, skill atrophy, and shallow reviews — DORA measures pace, not sustainability or quality
      c: DORA metrics are only valid for teams of 10 or more engineers
      d: Deployment frequency causes merge conflicts when AI generates too many branches
    correct: b
    explanation: "The velocity trap: a team rated High on DORA deployment frequency can simultaneously experience burnout (engineers rubber-stamping AI output), skill atrophy (engineers losing the ability to reason about code independently), and shallow reviews (speed pressure discourages deep inspection). DORA measures pace of delivery, but not whether the team understands what it is shipping. This is why Level 2 metrics (CFR by code origin, review time) exist — to surface quality degradation that hides behind fast numbers."
    doc_reference:
      file: guide/roles/learning-with-ai.md
      section: Team-Level Steering Metrics
      anchor: "#team-level-steering-metrics"
  - id: 11-024
    difficulty: intermediate
    profiles:
      - senior
      - power
      - pm
    question: What is the '3 metrics, 5 minutes Monday ritual' for tech leads, and what does it protect against?
    options:
      a: A daily standup format that replaces sprint retrospectives
      b: A weekly check of deployment frequency, lead time, and test coverage to satisfy compliance requirements
      c: A weekly review of three steering metrics in under five minutes to catch drift early, before velocity-trap patterns solidify into team habits
      d: A tool that automatically generates weekly reports from git history
    correct: c
    explanation: "The Monday ritual is a lightweight weekly habit for tech leads: spend five minutes reviewing three steering metrics (typically Deployment Frequency, CFR by code origin, and review time delta). The goal is early detection of drift. Velocity traps, skill atrophy, and review shortcuts develop gradually — weekly check-ins catch the signal before it becomes a cultural pattern that is hard to reverse. Five minutes is intentionally short: the ritual should have near-zero friction so it actually happens."
    doc_reference:
      file: guide/roles/learning-with-ai.md
      section: Team-Level Steering Metrics
      anchor: "#team-level-steering-metrics"
