      - pm
    question: What is the 'Dependent' pattern's main risk according to the guide?
    options:
      a: Slower than peers
      b: Unemployable
      c: Left behind
      d: Overworked
    correct: b
    explanation: "The Dependent pattern's risk is becoming unemployable. Signs: copy-paste without understanding, can't debug AI code, anxiety without AI. In interviews: can't whiteboard basics, struggles with \"why this approach?\", asks to look up fundamentals. You ship code you can't explain - when it breaks, you're stuck."
    doc_reference:
      file: guide/roles/learning-with-ai.md
      section: "Pattern 1: Dependent"
      anchor: "#pattern-1-dependent"
  - id: 11-014
    difficulty: intermediate
    profiles:
      - junior
      - senior
      - power
    question: What is the Weekly Self-Audit question that detects dependency?
    options:
      a: How many lines of code did I write?
      b: Am I faster than last month? Am I smarter?
      c: How much did I use AI this week?
      d: Did I meet all my deadlines?
    correct: b
    explanation: "The key question is: \"Am I faster than last month? Am I smarter?\" If you're faster but NOT smarter, you're building dependency. Other weekly questions: What did I learn that I didn't know before? Could I have done this without AI? Did I understand everything I shipped?"
    doc_reference:
      file: guide/roles/learning-with-ai.md
      section: Weekly Self-Audit
      anchor: "#weekly-self-audit"
  - id: 11-015
    difficulty: intermediate
    profiles:
      - junior
      - senior
      - power
    question: What is the recommended approach for 'Avoidant' developers (Pattern 2)?
    options:
      a: Continue avoiding AI to maintain purity
      b: "Start with low-stakes AI use: generating boilerplate, explaining unfamiliar code, writing docs, and generating test cases"
      c: Immediately switch to 100% AI usage
      d: Wait until AI tools are more mature
    correct: b
    explanation: "For Avoidant developers (Pattern 2), the guide's Week 1 'Low-Stakes Introduction' recommends easing in with low-risk AI tasks: generating boilerplate, asking AI to explain unfamiliar code, writing documentation, and generating test cases. This builds familiarity without ceding control of the core problem-solving. (Starting with AI reviewing YOUR own code is the guide's remedy for the Dependent pattern, not the Avoidant one.) Pure avoidance means being slower without being smarter."
    doc_reference:
      file: guide/roles/learning-with-ai.md
      section: Embracing AI Tools
      anchor: "#embracing-ai-tools"
  - id: 11-016
    difficulty: senior
    profiles:
      - senior
      - power
    question: What are the 3 failure modes identified in Addy Osmani's '80% Problem' of agentic coding?
    options:
      a: Context loss, token overflow, hallucination
      b: Overengineering, assumption propagation, sycophantic agreement
      c: Slow responses, wrong language, missed tests
      d: Memory leaks, race conditions, deadlocks
    correct: b
    explanation: |-
      Addy Osmani's "80% Problem" identifies 3 failure modes:

      1. **Overengineering** - AI adds unnecessary complexity (abstraction layers, premature optimization)
      2. **Assumption propagation** - One wrong assumption cascades through the codebase
      3. **Sycophantic agreement** - AI agrees with bad ideas instead of pushing back

      The 80% refers to AI getting you 80% of the way, with the last 20% requiring deep human understanding.
    doc_reference:
      file: guide/ecosystem/ai-ecosystem.md
      section: Addy Osmani (Google Chrome Team)
      anchor: "#addy-osmani-google-chrome-team"
  - id: 11-017
    difficulty: intermediate
    profiles:
      - junior
      - senior
      - power
    question: What are the 3 symptoms of vibe coding 'context overload'?
    options:
      a: Memory leaks, slow startup, API rate limits
      b: Big-bang context dumps, 5K+ line prompts, performance degradation
      c: Lost files, broken imports, missing tests
      d: Excessive commits, merge conflicts, branch proliferation
    correct: b
    explanation: |-
      Context overload symptoms in vibe coding:

      1. **Big-bang context dumps** - Pasting entire codebases into prompts
      2. **5K+ line prompts** - Exceeding effective context window usage
      3. **Performance degradation** - Claude's quality drops as context grows

      The fix: progressive disclosure (feed context incrementally), use CLAUDE.md for persistent context, and start fresh sessions between phases.
    doc_reference:
      file: guide/ultimate-guide.md
      section: "Anti-Pattern: Context Overload"
      anchor: "#anti-pattern-context-overload"
  - id: 11-018
    difficulty: senior
    profiles:
      - senior
      - power
    question: What was the key finding of the METR Experienced Developer RCT (2025, arXiv:2507.09089)?
    options:
      a: AI tools made experienced developers 40% faster on large codebases
      b: Developers correctly estimated they were 19% slower when using AI tools
      c: AI tools had no measurable impact on developer speed on large codebases
      d: AI tools made experienced developers 19% slower on large codebases despite developers perceiving themselves as 20% faster
    correct: d
    explanation: |-
      The METR RCT studied 16 experienced developers across 246 issues on large codebases (1M+ lines). The counterintuitive finding: AI tools made these experienced developers **19% slower** — yet developers **perceived themselves as 20% faster** (a 39-point perception gap). This is considered the strongest evidence for skill atrophy risk in experienced developers working on large, familiar codebases. The study highlights the difference between performance on isolated tasks (where AI helps) vs. navigating complex existing systems (where familiarity matters more).
      ---
    doc_reference:
      file: guide/roles/learning-with-ai.md
      section: Productivity Research
      anchor: "#productivity-research"
  - id: 11-019
    difficulty: senior
    profiles:
      - senior
      - power
    question: What was the key finding of the Borg et al. "Echoes of AI" RCT (2025, arXiv:2507.00788)?
    options:
      a: AI users were 30.7% slower due to debugging AI-generated code
      b: AI users were 30.7% faster (median), with no significant difference in code maintainability for downstream developers
      c: AI users produced 30.7% more bugs than non-AI developers
      d: AI code was 30.7% harder to maintain compared to human-written code
    correct: b
    explanation: |-
      The "Echoes of AI" study (151 participants, 95% professional developers) found AI users were **30.7% faster** (median), with habitual users reaching ~55.9% faster. Critically, Phase 2 tested maintainability: downstream developers evolving AI-generated code showed **no significant difference** in evolution time or code quality vs. human-generated code. This is the first RCT to explicitly target AI code maintainability. The study was co-authored by Dave Farley ("Continuous Delivery") — note it is an arXiv preprint, not yet published in peer-reviewed proceedings.
      ---
    doc_reference:
      file: guide/roles/learning-with-ai.md
      section: Productivity Research
      anchor: "#productivity-research"
