    question: What promotional pricing accompanied the Claude Sonnet 5 launch in Claude Code (v2.1.197)?
    options:
      a: $2 per million input tokens and $10 per million output tokens, through August 31
      b: $3 per million input tokens and $15 per million output tokens, through August 31
      c: No cost at all for any user during the launch window
      d: $1 per million input tokens and $5 per million output tokens, through August 31
    correct: a
    explanation: The v2.1.197 release notes state Sonnet 5 launched with promotional pricing of $2 per million input tokens and $10 per million output tokens, valid through August 31. It was not free, and the other price pairs don't match the release notes. Treat this as a time-limited launch promotion, not permanent pricing.
