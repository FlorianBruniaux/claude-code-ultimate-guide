  - id: 02-021
    difficulty: senior
    profiles:
      - senior
      - power
    question: Why does the guide treat "just use the 1M-token context window" as an anti-pattern rather than a capability win?
    options:
      a: Because 1M-token windows aren't actually available to most Claude Code users yet
      b: Because a 1M-token window costs the same per request regardless of how full it is
      c: Because a window full of noise, stale turns, and redundant instructions performs worse than a smaller, curated one, and costs more
      d: Because the API throws a hard error once a session crosses roughly 900K tokens
    correct: c
    explanation: The guide frames this as a signal-to-noise question, not a capacity question. A 128K-token window with well-maintained, curated content outperforms a 1M-token window loaded with stale turns and redundant tool output. The large window doesn't eliminate context rot, it delays it while making each request slower and more expensive. There's no hard token error at 900K, and cost scales with what's actually sent, so filling the window for its own sake is pure downside.
    doc_reference:
      file: guide/core/context-engineering.md
      section: "MECW: Maximum Effective Context Window"
  - id: 02-022
    difficulty: intermediate
    profiles:
      - senior
      - power
    question: What is the BMAD (Big Model Agentic Development) methodology best suited for?
    options:
      a: Small teams of 2-3 people needing fast iteration
      b: High-complexity projects with stable requirements where deep planning pays off
      c: Any project with more than 10 developers
      d: Greenfield projects only, never legacy codebases
    correct: b
    explanation: BMAD is optimized for high-complexity projects with stable requirements — where the upfront investment in structured planning (requirements, architecture, stories) pays dividends. The key criterion is complexity + stability, not team headcount. BMAD uses specialized agents (Analyst, Architect, SM, Dev) to break down and execute work systematically. It struggles with rapidly changing requirements because replanning cost is high.
    doc_reference:
      file: guide/core/methodologies.md
      section: "Tier 1: Strategic Orchestration"
      anchor: "#tier-1-strategic-orchestration"
  - id: 02-023
    difficulty: intermediate
    profiles:
      - senior
      - power
    question: What is the primary criterion for choosing FDD (Feature-Driven Development) with Claude Code?
    options:
      a: Teams smaller than 5 developers who need a simple process
      b: Feature teams with parallel delivery needs — multiple features developed simultaneously
      c: Projects requiring detailed UML documentation and design models
      d: Enterprise teams with more than 50 developers
    correct: b
    explanation: FDD's primary criterion is feature teams with parallel delivery needs — multiple features being developed simultaneously across the team. FDD's per-feature iteration (Design → Build) maps well onto Claude Code's session-based workflow, where each feature gets a dedicated planning and implementation session. The key signal is "parallel delivery", not team size. FDD is less suited to projects where features have deep interdependencies requiring sequential development.
    doc_reference:
      file: guide/core/methodologies.md
      section: "Tier 4: Feature Delivery"
      anchor: "#tier-4-feature-delivery"
