      section: TeammateTool (Experimental)
      anchor: "#teammatetool-experimental"
  - id: 12-016
    difficulty: senior
    profiles:
      - senior
      - power
    question: An empirical study across dozens of open-source agent frameworks and hundreds of agentic applications, cited in the agent harness guide, found a mismatch in where testing effort goes. What is that mismatch?
    options:
      a: Testing effort is split evenly between deterministic components and the LLM reasoning core, but adoption of dedicated LLM eval tools exceeds 50%
      b: More than 70% of testing effort targets the LLM reasoning core, while less than 5% targets deterministic components like tool calls
      c: Adoption of dedicated LLM evaluation tools like DeepEval exceeds 60%, but testing of deterministic components is neglected entirely
      d: More than 70% of testing effort targets deterministic components like tools and workflow logic, while less than 5% targets the LLM reasoning core (the Plan Body)
    correct: d
    explanation: The study found more than 70% of testing effort targets deterministic components such as tools, APIs, and workflow logic, while less than 5% targets the Plan Body, the LLM reasoning core where non-obvious failures like plausible-but-wrong outputs actually live. Adoption of dedicated LLM evaluation tools sat below 1%, not above 50 or 60% as in options a and c. Option b inverts the real finding. The guide recommends rebalancing to at minimum 20-30% of testing effort on the Plan Body.
    doc_reference:
      file: guide/core/agent-harness.md
      section: 7. Test Distribution Anti-pattern
      anchor: "#7-test-distribution-anti-pattern"
  - id: 12-017
    difficulty: intermediate
    profiles:
      - senior
      - power
    question: Claude Code v2.1.191 reduced CPU usage during streaming by roughly 37%. What internal change achieved this?
    options:
      a: Text updates were coalesced to 100ms intervals instead of being rendered per-token
      b: Streaming was moved from the terminal renderer to a WebSocket-based diffing engine
      c: Tool call schemas were cached across turns to avoid re-parsing on every token
      d: The context window was pruned continuously during streaming rather than only at compaction time
    correct: a
    explanation: The release note states CPU usage during streaming dropped about 37% by coalescing text updates to 100ms intervals instead of updating the display per token. This is a separate figure from the token-reduction percentage attributed to dynamic tool dispatch elsewhere in the guide, the two numbers measure different things, CPU cycles during rendering versus token usage from tool schema loading, and happen to land in a similar range by coincidence. Options b, c, and d describe plausible-sounding but unstated mechanisms not mentioned in the release note.
    doc_reference:
      file: guide/core/claude-code-releases.md
      section: v2.1.191
  - id: 12-018
    difficulty: senior
    profiles:
      - senior
      - power
    question: What is 'Context Rot' and what makes it structural rather than incidental?
    options:
      a: Gradual quality degradation caused by too many code comments in the context window
      b: "The n² attention cost: as context grows, each new token attends to all previous tokens, causing exponential slowdown and quality degradation regardless of content quality"
      c: Rot caused by leaving unused variables and dead code in the context
      d: API rate limiting that causes degraded responses when context is large
    correct: b
    explanation: "Context Rot is structural, not incidental: transformer attention is O(n²) — each new token attends to all previous tokens. As context grows, the effective attention per token dilutes, early context gets underweighted, and recent tokens dominate disproportionately. This happens even with high-quality context content. Solutions: /compact (prune), context chaining (fresh session with curated summary), or JIT retrieval (never load; fetch on demand). You cannot fix structural rot by cleaning up your prompts."
    doc_reference:
      file: guide/core/architecture.md
      section: Context Rot
  - id: 12-019
    difficulty: power
    profiles:
      - power
    question: What is the key difference between JIT (Just-In-Time) retrieval and RAG in the context of Claude Code sub-agents?
    options:
      a: JIT retrieval uses vector databases while RAG uses keyword search
      b: JIT retrieval never pre-loads context — sub-agents fetch only what they need at the moment of need; RAG pre-indexes and embeds documents upfront for semantic lookup
      c: JIT is faster but less accurate; RAG is slower but more precise
      d: JIT is for code retrieval only; RAG handles documentation retrieval
    correct: b
    explanation: "JIT retrieval in sub-agents means: never pre-load context — the agent identifies what it needs (WHY/WHAT pattern), fetches only that, processes it, then discards. This keeps context windows small per agent. RAG pre-indexes and embeds a corpus upfront, enabling semantic similarity lookup at query time. For Claude Code sub-agents: JIT is preferred for targeted retrieval tasks (no embedding setup, no stale index); RAG suits knowledge bases queried repeatedly across many sessions."
    doc_reference:
      file: guide/core/architecture.md
      section: JIT vs RAG Retrieval
  - id: 12-020
    difficulty: power
    profiles:
      - power
    question: What is MMD (Maximum Mean Discrepancy) used for in context drift detection?
    options:
      a: Measuring the maximum number of tokens that can drift before a session crashes
      b: A statistical test comparing the distribution of recent token embeddings to a baseline distribution to detect semantic drift in ongoing conversations
      c: Tracking the maximum memory distance between two related CLAUDE.md files
      d: A compression algorithm that minimizes mean deviation in context summaries
    correct: b
    explanation: "MMD (Maximum Mean Discrepancy) is a kernel-based statistical test that compares two distributions without assuming a parametric form. In context drift detection: you embed tokens/messages from a baseline window and a recent window, then compute MMD between the two distributions. A high MMD score indicates the conversation has drifted semantically from its original topic — a signal to /compact or start a fresh session. Threshold: MMD > 0.3 typically warrants intervention. More robust than cosine distance for multi-modal drift."
    doc_reference:
      file: guide/core/architecture.md
      section: Context Drift Detection
  - id: 12-021
    difficulty: intermediate
    profiles:
      - senior
      - power
    question: What is the 'Goldilocks altitude problem' for CLAUDE.md project rules?
    options:
      a: Finding the right file size for CLAUDE.md — not too large (context waste) nor too small (insufficient guidance)
      b: "The challenge of writing rules at the right abstraction level: too high-level (ignored/mis-applied) vs too low-level (brittle, over-specified)"
      c: Choosing the right directory depth for nested CLAUDE.md files in a monorepo
      d: Balancing rule strictness — too strict causes Claude to refuse valid tasks, too loose provides no guidance
    correct: b
    explanation: 'The Goldilocks altitude problem: rules written too high ("write good code") are too abstract to apply consistently. Rules written too low ("always add a blank line after function declarations") are brittle — they conflict with context or become stale. The sweet spot is mid-altitude: specific enough to be actionable, abstract enough to generalize across similar situations. Example of right altitude: "prefer functional style for data transformations; use classes only when you need stateful lifecycle management."'
    doc_reference:
      file: guide/core/architecture.md
      section: Goldilocks Altitude
