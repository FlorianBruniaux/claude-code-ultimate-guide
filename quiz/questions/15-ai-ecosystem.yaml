    question: What is the 'Minimal Stack' monthly cost recommendation for AI tools?
    options:
      a: $200+/month - all Pro subscriptions
      b: $40-70/month - Claude Code + Perplexity Pro, free tiers for rest
      c: $0 - only free tiers
      d: $500+/month - enterprise plans
