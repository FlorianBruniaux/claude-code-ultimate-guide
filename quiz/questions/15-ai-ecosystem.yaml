  - id: 15-017
    difficulty: intermediate
    profiles:
      - power
      - pm
    question: Both MCP Apps and the Vercel AI SDK's generative UI pattern let a model produce an interactive interface, but at different layers of the stack. What is the key architectural difference between them?
    options:
      a: The Vercel AI SDK requires a schema and a client-side renderer, while MCP Apps has no validation step at all
      b: MCP Apps carries a rendered HTML/iframe payload back through a tool response, while the Vercel AI SDK streams React components directly from the server so the client never parses an intermediate format
      c: MCP Apps is React-only like the Vercel AI SDK; the only difference is which company authored the spec
      d: MCP Apps only works inside Claude Desktop, while the Vercel AI SDK approach works across every MCP client
    correct: b
    explanation: "MCP Apps is a protocol-level extension: a tool response carries an HTML/iframe payload that the client renders. The Vercel AI SDK pattern skips that intermediate format entirely, the server picks and streams React components directly, so there is nothing for the client to parse. Option c is false, the Vercel SDK is React-only while MCP Apps already ships across multiple clients including Claude Desktop, VS Code, ChatGPT, and Goose. Option d reverses which one is multi-client."
    doc_reference:
      file: guide/ecosystem/ai-ecosystem.md
      section: "7.1 Generative UI: Agent-Driven Interactive Output Formats"
      anchor: "#71-generative-ui-agent-driven-interactive-output-formats"
  - id: 15-018
    difficulty: intermediate
    profiles:
      - senior
      - power
      - pm
    question: In the team knowledge base guide's three-tier model, at roughly what corpus size does adding a Tier 3 RAG layer, exposed to the agent as an MCP server, start to outweigh reading files directly or connecting to a live source?
    options:
      a: 10 to 50 documents
      b: There is no size threshold; RAG should be the default from day one for any team knowledge base
      c: Roughly 100 to 1,000 documents
      d: 5,000 to 10,000 documents
    correct: c
    explanation: The guide places the crossover at roughly 100 to 1,000 documents, depending on document size and how much each query needs to span. Below that range, direct file reads or a live connector keep the accuracy of reading the actual document. The guide explicitly warns against adding RAG by default, since it is infrastructure with a maintenance cost, which rules out option b.
    doc_reference:
      file: guide/ecosystem/team-knowledge-base.md
      section: "Tier 3: RAG at Scale"
      anchor: "#tier-3-rag-at-scale"
  - id: 15-019
    difficulty: power
    profiles:
      - power
    question: Claude Code's gateway layer added Claude Platform on AWS as an additional upstream provider option in v2.1.198. What else changed alongside it in the same release note?
    options:
      a: The ANTHROPIC_BASE_URL environment variable was deprecated in favor of a JSON config block
      b: Bedrock and Vertex AI support were removed in favor of anthropicAws
      c: A new /gateway slash command replaced /model for provider switching
      d: Model-not-found responses now advance the failover chain instead of stopping it
    correct: d
    explanation: The same release note states that model-not-found responses now advance the failover chain, meaning a missing model on one provider no longer dead-ends the gateway lookup. Nothing in that release deprecates ANTHROPIC_BASE_URL, removes Bedrock or Vertex support, or introduces a /gateway command.
    doc_reference:
      file: guide/core/claude-code-releases.md
      section: v2.1.198
  - id: 15-020
    difficulty: senior
    profiles:
      - senior
      - power
    question: What is Google Antigravity and how does it differ from traditional IDEs?
    options:
      a: A Google internal testing framework that simulates zero-gravity code reviews
      b: An agent-first IDE where the AI drives execution and the human reviews rather than the reverse
      c: A VSCode extension that integrates Google's Gemini model into the editor
      d: Google's replacement for GitHub Copilot using a different suggestion UI
    correct: b
    explanation: Google Antigravity is an agent-first IDE that inverts the traditional IDE model. In classic IDEs, the human drives and the AI assists. In Antigravity, the agent drives execution while the human reviews, approves, and steers. The human becomes the reviewer rather than the typist. This represents a paradigm shift from AI-assisted coding to AI-led coding with human oversight — the model that Claude Code's agentic mode already approximates.
    doc_reference:
      file: guide/ecosystem/ai-ecosystem.md
      section: 6.1 Google Antigravity (Agent-First IDE)
      anchor: "#61-google-antigravity-agent-first-ide"
  - id: 15-021
    difficulty: power
    profiles:
      - power
    question: What does research show about AGENTS.md Compound Learning — specifically human-curated vs LLM-generated updates?
    options:
      a: LLM-generated updates are always superior because they are more consistent and complete
      b: Human-curated AGENTS.md updates yield +4% performance improvement; LLM-generated updates yield -3% performance with +20% cost increase
      c: Both methods produce identical results, so LLM generation is preferred for automation
      d: Human-curated updates are only better for junior developers; LLM-generated outperforms for senior codebases
    correct: b
    explanation: "AGENTS.md Compound Learning research shows a stark divergence: human-curated updates to AGENTS.md (based on real session feedback and corrections) produce a +4% improvement in agent performance across benchmark tasks. LLM-auto-generated AGENTS.md updates produce -3% performance regression and +20% cost increase because auto-generated rules tend to over-specify, conflict, or add noise. Implication: invest human review time in AGENTS.md/CLAUDE.md maintenance — it compounds."
    doc_reference:
      file: guide/workflows/agent-teams.md
      section: AGENTS.md for Compound Learning
      anchor: "#agentsmd-for-compound-learning"
