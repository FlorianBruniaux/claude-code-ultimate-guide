  - id: 15-014
    difficulty: senior
    profiles:
      - senior
      - power
    question: What is RTK (Rust Token Killer) and how does it work?
    options:
      a: A Rust-based linter that removes unused code tokens before compilation
      b: A tool that compresses API responses to reduce billing costs
      c: A CLI proxy that filters command outputs before they reach Claude's context, reducing token consumption by 60-90%
      d: A plugin that replaces verbose error messages with concise summaries in the IDE
    correct: c
    explanation: |-
      RTK is a **CLI proxy** (Rust binary, 446 stars) that filters command outputs **before** they reach Claude's context. Example: `rtk git status` reduces a typical `git status` output by ~76%; `rtk git log` by ~92%. Supports git, cargo, pnpm, vitest, prisma, docker, mypy, aws, psql, and more. Uses a hook-first install (`rtk init --global`) so commands are auto-rewritten transparently. `rtk gain` shows token savings analytics. The TOML Filter DSL allows adding custom filters for any command without writing Rust. Key distinction: RTK **reduces** token consumption (preprocessing); tools like ccusage **monitor** it (postprocessing).
      ---
    doc_reference:
      file: guide/ecosystem/third-party-tools.md
      section: RTK (Rust Token Killer)
      anchor: "#rtk-rust-token-killer"
  - id: 15-015
    difficulty: senior
    profiles:
      - senior
      - power
    question: How does the guide contrast Claude Code and Google Antigravity's core philosophies?
    options:
      a: Claude Code is terminal-first (predictable, pipeline-native); Antigravity is agent-first IDE (higher autonomy, experimental)
      b: Claude Code is cloud-only; Antigravity works fully offline
      c: Claude Code supports only Claude models; Antigravity is model-agnostic
      d: Claude Code is for enterprise teams; Antigravity is for solo developers
    correct: a
    explanation: |-
      Claude Code is **terminal-first, CLI-native** — optimized for predictability, explicit approval per edit, and deep integration with existing developer workflows (CI/CD, headless pipelines). Google Antigravity is an **agent-first IDE** (VS Code fork) — makes autonomous agents the primary interface, with higher autonomy and a mission control-style UI. The guide's bottom line: Claude Code optimizes for **predictability and workflow integration**; Antigravity optimizes for **maximum agent autonomy with experimental trade-offs**. Antigravity is recommended for rapid prototyping or non-CLI developers; Claude Code for production code, CI/CD, and team standardization.
      ---
    doc_reference:
      file: guide/ecosystem/ai-ecosystem.md
      section: Google Antigravity
      anchor: "#61-google-antigravity-agent-first-ide"
