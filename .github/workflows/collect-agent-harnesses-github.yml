name: Collect Agent Harness GitHub Metadata

on:
  workflow_dispatch:
  schedule:
    - cron: "17 04 * * 1"

permissions:
  contents: read

concurrency:
  group: collect-agent-harnesses-github
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect one complete GitHub metadata sidecar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/collect-agent-harnesses-github.py \
            --catalog machine-readable/agent-harnesses.json \
            --output "$RUNNER_TEMP/agent-harnesses-github.json" \
            --captured-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Upload candidate sidecar for manual promotion
        uses: actions/upload-artifact@v4
        with:
          name: agent-harnesses-github-${{ github.run_id }}
          path: ${{ runner.temp }}/agent-harnesses-github.json
          if-no-files-found: error
          retention-days: 14
